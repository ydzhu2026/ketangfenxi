// ===== demo_auth_logic.js =====
// ===================================================================
// 登录与活动列表：纯逻辑（不依赖 Vue / DOM，可在 Node 里测试）
// 目标工程对应 src/utils/auth.ts、src/utils/activity-list.ts
//
// ★ 这是"演示级"登录，不是真正的认证。
//   页面是静态 html，账号表和校验逻辑都在浏览器里，打开开发者工具就能看到，
//   所以它挡不住任何有意绕过的人。正式工程必须由后端校验，并签发有时效的令牌。
//   尽管如此，源码里仍然不写明文密码：账号表只存"加盐 PBKDF2 哈希"，
//   读源码读不出密码；迁移到后端时，校验流程也能直接对应。
// ===================================================================

const AUTH_STORAGE_KEY = 'ai-classroom-auth-v1';
const ACTIVITY_STORAGE_KEY = 'ai-classroom-activities-v1';

// PBKDF2 参数。迭代次数是演示取值：足够让"逐个试密码"慢一点，又不拖慢登录。
const PBKDF2_ITERATIONS = 100000;
const PBKDF2_HASH_BYTES = 32;

// 登录失败节流：连续错 N 次后锁一段时间。仅防手滑反复试，防不了绕过前端的人。
const MAX_FAILED_ATTEMPTS = 5;
const LOCKOUT_MS = 30 * 1000;

// 登录会话有效期。到期后要求重新登录。
const SESSION_TTL_MS = 8 * 60 * 60 * 1000;

// ---------------------------------------------------------------
// 字节 / 十六进制 / 比较
// ---------------------------------------------------------------

function bytesToHex(bytes) {
  const arr = Array.from(new Uint8Array(bytes));
  return arr.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function utf8Bytes(str) {
  return new TextEncoder().encode(str);
}

/**
 * 常数时间字符串比较：长度相同时逐字符累积差异，不因第一个不同字符就提前返回。
 * 前端演示里意义有限，但这是正确写法，迁到后端可直接沿用。
 */
function safeEqual(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string') return false;
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

/**
 * 派生密码哈希（PBKDF2-SHA256）。浏览器与 Node 都走 WebCrypto 的同一套参数，
 * 这样同一份账号表在两边算出的哈希一致（测试里就是用 Node 验证的）。
 */
async function derivePasswordHash(password, saltHex, subtle) {
  const s = subtle || (typeof crypto !== 'undefined' ? crypto.subtle : null);
  if (!s) throw new Error('当前环境不支持 WebCrypto（需要 https 或 localhost 打开）');
  const key = await s.importKey('raw', utf8Bytes(password), 'PBKDF2', false, ['deriveBits']);
  const salt = new Uint8Array(saltHex.match(/.{2}/g).map(function (h) { return parseInt(h, 16); }));
  const bits = await s.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: PBKDF2_ITERATIONS },
    key, PBKDF2_HASH_BYTES * 8);
  return bytesToHex(bits);
}

// ---------------------------------------------------------------
// 账号输入规范化
// ---------------------------------------------------------------

/** 账号去首尾空白、统一小写比较（演示账号都是小写字母数字）。密码不做任何改动。 */
function normalizeAccount(raw) {
  if (typeof raw !== 'string') return '';
  return raw.replace(/[\s　]+/g, ' ').trim().toLowerCase();
}

// ---------------------------------------------------------------
// 登录校验
// ---------------------------------------------------------------

/**
 * 校验账号密码。
 *
 * users : [{ account, saltHex, hashHex, displayName, role }]
 * 返回  : { ok:true, user:{account,displayName,role} } 或 { ok:false, reason }
 *
 * 不论是"账号不存在"还是"密码错误"，都返回同一句提示，
 * 不告诉调用方账号是否存在（避免被用来枚举账号）。
 * 账号不存在时也照样算一遍哈希，让两种失败耗时接近。
 */
async function verifyLogin(account, password, users, subtle) {
  const acc = normalizeAccount(account);
  if (!acc) return { ok: false, reason: '请输入账号' };
  if (typeof password !== 'string' || password === '') return { ok: false, reason: '请输入密码' };

  const user = users.filter(function (u) { return u.account === acc; })[0];
  // 账号不存在时用一个固定的假盐，照样做一次完整的 PBKDF2
  const saltHex = user ? user.saltHex : '00000000000000000000000000000000';
  const got = await derivePasswordHash(password, saltHex, subtle);
  const expected = user ? user.hashHex : '';
  if (user && safeEqual(got, expected)) {
    return { ok: true, user: { account: user.account, displayName: user.displayName, role: user.role } };
  }
  return { ok: false, reason: '账号或密码不正确' };
}

// ---------------------------------------------------------------
// 失败节流（纯函数：状态进、状态出，时间由调用方传入，便于测试）
// ---------------------------------------------------------------

function emptyThrottle() { return { failed: 0, lockedUntil: 0 }; }

/** 当前是否处于锁定中；返回剩余毫秒数（0 表示未锁）。 */
function lockRemaining(state, now) {
  if (!state || !state.lockedUntil) return 0;
  return Math.max(0, state.lockedUntil - now);
}

/** 记录一次失败，达到上限则进入锁定。返回新状态（不改入参）。 */
function recordFailure(state, now) {
  const failed = ((state && state.failed) || 0) + 1;
  if (failed >= MAX_FAILED_ATTEMPTS) return { failed: 0, lockedUntil: now + LOCKOUT_MS };
  return { failed: failed, lockedUntil: (state && state.lockedUntil) || 0 };
}

/** 登录成功后清零。 */
function recordSuccess() { return emptyThrottle(); }

// ---------------------------------------------------------------
// 会话
// ---------------------------------------------------------------

function makeSession(user, now) {
  return { account: user.account, displayName: user.displayName, role: user.role,
           issuedAt: now, expiresAt: now + SESSION_TTL_MS };
}

/** 会话是否有效。结构不对、缺字段、已过期都算无效。 */
function isSessionValid(session, now) {
  if (!session || typeof session !== 'object') return false;
  if (typeof session.account !== 'string' || !session.account) return false;
  if (typeof session.expiresAt !== 'number' || !isFinite(session.expiresAt)) return false;
  return session.expiresAt > now;
}

// ---------------------------------------------------------------
// 活动列表
// ---------------------------------------------------------------

// 活动状态。"已分析"只属于有真实分析数据的活动；
// 用户新增的活动在这个纯前端页里没有任何分析数据，只能是"待分析"。
const ACTIVITY_STATUS = {
  ANALYZED: 'analyzed',   // 有完整分析结果，可进入查看
  PENDING: 'pending',     // 已登记，等待上传转写并分析
};

const ACTIVITY_NAME_MAX = 40;
const ACTIVITY_FIELD_MAX = 30;

/** 去控制字符、规整空白（与评估人姓名同一套思路）。 */
function cleanText(s) {
  // Reuses stripInvisible from demo_manual_logic.js instead of a second copy.
  // Invisible characters written literally into source get mangled by editors and
  // already caused syntax errors twice, so there is exactly one definition.
  return stripInvisible(s === null || s === undefined ? '' : s);
}

/**
 * 校验并规范化"新增活动"表单。
 * 返回 { ok:true, value } 或 { ok:false, errors:{字段:提示} }。
 * 与评估人姓名一致：含 < > 或过长直接拒绝并说明原因，不静默改写。
 */
/**
 * 把 YYYY-MM-DD 显示成“2026年9月12日”。
 * 只认合法的日历日期；空值、格式不对、2 月 30 日这类不存在的日期，一律原样返回，
 * 不猜、不补零、不抛错——显示层宁可显示原文，也不要把一个坏数据“修”成另一个看起来正确的日期。
 */
function formatTeachingDate(s) {
  if (typeof s !== 'string') return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return s;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return s;
  return y + '年' + mo + '月' + d + '日';
}

function validateNewActivity(form) {
  const errors = {};
  const name = cleanText(form && form.name);
  const className = cleanText(form && form.className);
  const teacher = cleanText(form && form.teacher);
  const domain = cleanText(form && form.domain);
  const date = cleanText(form && form.date);

  function checkText(key, val, label, max, required) {
    if (!val) { if (required) errors[key] = label + '不能为空'; return; }
    if (/[<>]/.test(val)) { errors[key] = label + '里不能包含 < 或 > 符号'; return; }
    if (Array.from(val).length > max) errors[key] = label + '最多 ' + max + ' 个字符';
  }
  checkText('name', name, '活动名称', ACTIVITY_NAME_MAX, true);
  checkText('className', className, '班级', ACTIVITY_FIELD_MAX, true);
  checkText('teacher', teacher, '执教教师', ACTIVITY_FIELD_MAX, true);
  checkText('domain', domain, '领域', ACTIVITY_FIELD_MAX, false);

  if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) errors.date = '授课时间格式应为 YYYY-MM-DD';
  else if (date) {
    const d = new Date(date + 'T00:00:00Z');
    if (isNaN(d.getTime()) || d.toISOString().slice(0, 10) !== date) errors.date = '授课时间不是有效日期';
  }

  if (Object.keys(errors).length) return { ok: false, errors: errors };
  return { ok: true, value: { name: name, className: className, teacher: teacher, domain: domain, date: date } };
}

/**
 * 同一天、同班级、同名称视为重复登记，拒绝。
 * date 为空时只比较名称+班级。
 */
function isDuplicateActivity(list, candidate) {
  return list.some(function (a) {
    return a.name === candidate.name && a.className === candidate.className &&
           (a.date || '') === (candidate.date || '');
  });
}

function newActivityId() {
  return 'act-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
}

/** 由已校验的表单生成一条"待分析"活动。 */
function makePendingActivity(value, owner, now) {
  return {
    id: newActivityId(),
    name: value.name, className: value.className, teacher: value.teacher,
    domain: value.domain, date: value.date,
    status: ACTIVITY_STATUS.PENDING,
    builtin: false,
    createdBy: owner,
    createdAt: now,
  };
}

/**
 * 把"内置的示范活动"和"用户新增的活动"合并成展示列表。
 * 内置活动永远在前、不可删除；用户活动按新增时间倒序。
 */
function mergeActivities(builtinList, userList) {
  const users = (userList || []).slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
  return builtinList.concat(users);
}

/**
 * 读取本地存储的用户活动并做基本清洗：丢弃结构不对的、
 * 强制 status 不能是 analyzed（用户活动没有分析数据，存储里被改成 analyzed 也不认）。
 */
function sanitizeStoredActivities(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(function (a) {
    return a && typeof a === 'object' && typeof a.id === 'string' && a.id && typeof a.name === 'string';
  }).map(function (a) {
    const v = validateNewActivity(a);
    const base = v.ok ? v.value : { name: cleanText(a.name).replace(/[<>]/g, ''), className: cleanText(a.className).replace(/[<>]/g, ''),
      teacher: cleanText(a.teacher).replace(/[<>]/g, ''), domain: cleanText(a.domain).replace(/[<>]/g, ''), date: '' };
    return {
      id: a.id, name: base.name || '未命名活动', className: base.className, teacher: base.teacher,
      domain: base.domain, date: base.date,
      status: ACTIVITY_STATUS.PENDING,       // 无论存储里写的是什么，一律按待分析
      builtin: false,
      createdBy: typeof a.createdBy === 'string' ? cleanText(a.createdBy) : '',
      createdAt: typeof a.createdAt === 'number' && isFinite(a.createdAt) ? a.createdAt : 0,
    };
  });
}

if (typeof module !== 'undefined' && module.exports && typeof stripInvisible === 'undefined') {
  global.stripInvisible = require('./demo_manual_logic.js').stripInvisible;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    AUTH_STORAGE_KEY, ACTIVITY_STORAGE_KEY, PBKDF2_ITERATIONS, MAX_FAILED_ATTEMPTS, LOCKOUT_MS, SESSION_TTL_MS,
    ACTIVITY_STATUS, ACTIVITY_NAME_MAX, ACTIVITY_FIELD_MAX,
    bytesToHex, safeEqual, derivePasswordHash, normalizeAccount, verifyLogin,
    emptyThrottle, lockRemaining, recordFailure, recordSuccess,
    makeSession, isSessionValid,
    cleanText, formatTeachingDate, validateNewActivity, isDuplicateActivity, makePendingActivity, mergeActivities, sanitizeStoredActivities,
  };
}

const AUTH_USERS = [{"account": "admin", "saltHex": "a51438f22ab8235a1e64d9a067828e43", "hashHex": "fddf90ae8e666e3371768cd0eb2111138061360910f9c04ef8ee4737dc71ba41", "displayName": "管理员", "role": "admin"}];

function readJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function writeJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}

function formatDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

const LoginView = {
  emits: ['success'],
  data() {
    return {
      account: '',
      password: '',
      showPassword: false,
      loading: false,
      errorMsg: '',
      throttle: readJson('ai-classroom-login-throttle-v1', emptyThrottle()),
      now: Date.now(),
      timer: null,
      needSecureContext: typeof crypto === 'undefined' || !crypto.subtle,
    };
  },
  computed: {
    lockSeconds() { return Math.ceil(lockRemaining(this.throttle, this.now) / 1000); },
    locked() { return this.lockSeconds > 0; },
  },
  mounted() {
    // 每秒刷新"现在"，用于锁定倒计时；解锁后自动清掉提示
    this.timer = setInterval(() => { this.now = Date.now(); }, 1000);
  },
  beforeUnmount() { clearInterval(this.timer); },
  methods: {
    async submit() {
      if (this.loading || this.locked) return;
      this.errorMsg = '';
      this.now = Date.now();
      if (this.needSecureContext) {
        this.errorMsg = '当前打开方式不支持登录校验，请通过 http://localhost 或 https 访问本页';
        return;
      }
      this.loading = true;
      try {
        const res = await verifyLogin(this.account, this.password, AUTH_USERS);
        if (res.ok) {
          this.throttle = recordSuccess();
          writeJson('ai-classroom-login-throttle-v1', this.throttle);
          this.password = '';
          this.$emit('success', makeSession(res.user, Date.now()));
          return;
        }
        // 空输入不算一次"失败尝试"，只提示
        if (res.reason === '请输入账号' || res.reason === '请输入密码') {
          this.errorMsg = res.reason;
          return;
        }
        this.throttle = recordFailure(this.throttle, Date.now());
        writeJson('ai-classroom-login-throttle-v1', this.throttle);
        this.now = Date.now();
        this.password = '';
        this.errorMsg = this.locked
          ? '连续输错 ' + MAX_FAILED_ATTEMPTS + ' 次，请 ' + this.lockSeconds + ' 秒后再试'
          : res.reason;
      } catch (e) {
        this.errorMsg = '登录校验出错：' + e.message;
      } finally {
        this.loading = false;
      }
    },
  },
  template: `
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">AI</div>
      <h1>AI幼教课堂分析系统</h1>
      <div class="login-sub">集体教学活动实录 · 多维度分析与评估</div>
    </div>

    <form @submit.prevent="submit" autocomplete="on" novalidate>
      <div class="login-field">
        <label for="login-account">账号</label>
        <a-input id="login-account" v-model:value="account" size="large" placeholder="请输入账号"
                 autocomplete="username" :disabled="loading" allow-clear />
      </div>
      <div class="login-field">
        <label for="login-password">密码</label>
        <a-input-password id="login-password" v-model:value="password" size="large" placeholder="请输入密码"
                 autocomplete="current-password" :disabled="loading" @pressEnter="submit" />
      </div>

      <a-alert v-if="locked" type="warning" show-icon style="margin-bottom:12px"
        :message="'登录已暂时锁定，请 ' + lockSeconds + ' 秒后再试'" />
      <a-alert v-else-if="errorMsg" type="error" show-icon style="margin-bottom:12px" :message="errorMsg" />

      <a-button type="primary" html-type="submit" size="large" block :loading="loading" :disabled="locked">
        登 录
      </a-button>
    </form>

    <div class="login-note">
      演示环境：账号校验在浏览器中完成，仅用于展示登录流程，不能作为真实的访问控制。
      正式使用将由服务端校验并签发有时效的登录凭证。
    </div>
  </div>
</div>

};

      });

      <a-segmented v-model:value="statusFilter" :options="[

// ===== demo_root.js =====
// ===================================================================
// 根组件：登录态 -> 活动列表 -> 活动详情（四个 tab）
// 目标工程对应 src/App.vue + src/router/index.ts（带登录守卫）
//
// 视图切换用一个 view 状态而不是路由：演示页是单个 html，不引入 vue-router。
// 目标工程里这三个视图是三条路由，登录守卫统一拦截未登录访问。
// ===================================================================

// 内置活动：来自真实分析数据，由 build_demo.py 把每个活动的数据注入 DEMO_DATA（按活动 id 索引）。
// 列表里显示的活动信息直接取自各活动自己的 meta，不手写，避免和详情页里显示的元数据不一致。
function buildBuiltinActivities(all) {
  return Object.keys(all).map(function (id) {
    const meta = all[id].meta;
    return {
      id: 'builtin-' + id,
      dataId: id,                  // 指向 DEMO_DATA 里的哪份数据
      name: meta.activity_name,
      className: meta.age_group,
      teacher: meta.source_teacher,
      domain: meta.domain,
      date: all[id].teachingDate || '',
      status: ACTIVITY_STATUS.ANALYZED,
      builtin: true,
      createdBy: '',
      createdAt: 0,
    };
  });
}

const RootApp = {
  components: {
    'login-view': LoginView,
    'activity-list-view': ActivityListView,
  },
  data() {
    // 启动时恢复登录态：会话存在、结构合法且未过期才算已登录
    const saved = readJson(AUTH_STORAGE_KEY, null);
    const session = isSessionValid(saved, Date.now()) ? saved : null;
    if (!session && saved) {
      try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) { /* 忽略 */ }
    }
    return {
      session: session,
      view: 'list',                 // list 活动列表 | detail 活动详情
      currentActivity: null,
      activeModule: 'verbatim',
      allData: DEMO_DATA,           // { 活动id: 该活动的分析数据 }
      sessionTimer: null,
    };
  },
  computed: {
    // 当前打开的活动的数据。没有打开活动时为 null，详情页模板只在打开后才渲染
    data() {
      const a = this.currentActivity;
      return a && a.dataId ? this.allData[a.dataId] : null;
    },
    meta() { return this.data ? this.data.meta : {}; },
    durationText() { return this.data ? fmtTime(this.data.meta.duration_sec) : ''; },
    teachingDateText() { return this.data && this.data.teachingDate ? formatTeachingDate(this.data.teachingDate) : ''; },
    builtinActivities() { return buildBuiltinActivities(this.allData); },
  },
  mounted() {
    // 会话到期后自动退回登录页，而不是等用户下一次操作才发现
    this.sessionTimer = setInterval(() => {
      if (this.session && !isSessionValid(this.session, Date.now())) {
        this.logout();
        antd.message.warning('登录已过期，请重新登录');
      }
    }, 30 * 1000);
  },
  beforeUnmount() { clearInterval(this.sessionTimer); },
  methods: {
    onLogin(session) {
      this.session = session;
      writeJson(AUTH_STORAGE_KEY, session);
      this.view = 'list';
    },
    logout() {
      this.session = null;
      this.view = 'list';
      this.currentActivity = null;
      try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) { /* 忽略 */ }
    },
    openActivity(act) {
      // 只有"已分析"的活动才有数据可看；待分析的在列表里已被禁用，这里再兜一层
      if (!act || act.status !== ACTIVITY_STATUS.ANALYZED) return;
      // 必须有对应的分析数据才进得去：数据不存在时留在列表并提示，不渲染一个空白详情页
      if (!act.dataId || !this.allData[act.dataId]) {
        antd.message.error('找不到「' + act.name + '」的分析数据');
        return;
      }
      this.currentActivity = act;
      this.activeModule = 'verbatim';
      this.view = 'detail';
      window.scrollTo(0, 0);
    },
    backToList() {
      this.view = 'list';
      this.currentActivity = null;
      window.scrollTo(0, 0);
    },
  },
};

const app = createApp(RootApp);
app.use(antd);
app.component('e-chart', EChart);
app.component('analysis-module', AnalysisModule);
app.component('assessment-module', AssessmentModule);
app.component('export-button', ExportButton);
app.component('verbatim-module', VerbatimModule);
app.component('manual-assessment-module', ManualAssessmentModule);
app.component('combined-review-module', CombinedReviewModule);
app.component('chain-list', ChainList);
app.mount('#app');

</script>
</body>
</html>
