eaker": "学生4", "text": "呃你"}, {"no": 187, "time": "00:15:24", "speaker": "老师", "text": "觉得是的是吧？噢有没有不一样的想法？"}, {"no": 188, "time": "00:15:28", "speaker": "学生2", "text": "我觉得这些乐器是让嗯如果没有这些乐器，打打着吹着这样这样这个唱戏，就没有节奏"}, {"no": 189, "time": "00:15:41", "speaker": "学生3", "text": "了，如果"}, {"no": 190, "time": "00:15:41", "speaker": "学生2", "text": "有了就特别的好听，"}, {"no": 191, "time": "00:15:44", "speaker": "老师", "text": "嗯他说这些乐器它其中有一个作用就是给唱戏的人伴奏的是吧？而且啊这些声音都是很有节奏的，鼓声是怎么样的？"}, {"no": 192, "time": "00:15:57", "speaker": "学生1", "text": "咚咚锵"}, {"no": 193, "time": "00:16:00", "speaker": "老师", "text": "咚咚锵咚咚锵一听又有劲又有节奏。"}, {"no": 194, "time": "00:16:07", "speaker": "学生1", "text": "好，"}, {"no": 195, "time": "00:16:08", "speaker": "老师", "text": "是的，没错，是给他们打节奏的，我记得还有人跟我说这一个乐器这个罗他还有一个作用，我听你们在阅读的时候，有人跟我提过是谁？还记得吗？这个锣这样铛铛铛敲起来是要干什么的？卢心悦你想起来"}, {"no": 196, "time": "00:16:30", "speaker": "学生2", "text": "就是它它就是吸吸引别人来看戏，"}, {"no": 197, "time": "00:16:35", "speaker": "老师", "text": "他说这个锣的作用是吸引别人，他和鼓和那个号子那个唢呐还不一样了，对吗？"}, {"no": 198, "time": "00:16:43", "speaker": "老师", "text": "好，我们来看看这个人他在敲锣的这个人，他的脸是看向哪里的？看戏台还是看外面？看戏台吗？不是，我把他看，我把他。这样你会看得更清楚，这个人他的表情，他的脸是朝哪里的？"}, {"no": 199, "time": "00:17:04", "speaker": "学生3", "text": "下面"}, {"no": 200, "time": "00:17:05", "speaker": "老师", "text": "朝下面的对不对？那说明他是要叫更多的人来看戏，如果你是那个敲锣的人，你会怎么喊？叫大家来看戏，你想来试试看是不是？来吧。模仿一下铛铛锣声开始啦招呼他们来看。"}, {"no": 201, "time": "00:17:25", "speaker": "学生2", "text": "戏快来呀快来，呀这里在唱戏呢有很好看的戏，"}, {"no": 202, "time": "00:17:31", "speaker": "老师", "text": "噢一定会有很多很多的人被你的锣声被你的招呼声给吸引来了。"}, {"no": 203, "time": "00:17:39", "speaker": "老师", "text": "在这一夜我们可以听到那么多的声音，孩子们，你觉得荷花镇的人他们喜欢看戏吗？从哪些地方能够感受到除了人很多，他们都会过来看戏，还有哪些细节也能告诉我们，他们很爱看戏，他们喜欢做这件事情，你来说。"}, {"no": 204, "time": "00:18:02", "speaker": "学生2", "text": "有些小朋友都在就是看戏的地方放风筝，"}, {"no": 205, "time": "00:18:09", "speaker": "老师", "text": "男女老少都在这里，小孩会做自己喜欢的事，是吗？还有吗？陶然你来说。"}, {"no": 206, "time": "00:18:14", "speaker": "学生2", "text": "嗯这这这里面还有一个老婆婆带着饭有"}, {"no": 207, "time": "00:18:20", "speaker": "老师", "text": "一个老婆婆带着饭，啊你们都看到过那一页啊对在是吗？那你来你来帮助我找出来，我都没发现在前一页是吧？"}, {"no": 208, "time": "00:18:33", "speaker": "学生1", "text": "在这一页吗？"}, {"no": 209, "time": "00:18:35", "speaker": "老师", "text": "哪个？"}, {"no": 210, "time": "00:18:37", "speaker": "学生2", "text": "我知道。"}, {"no": 211, "time": "00:18:38", "speaker": "学生1", "text": "噢"}, {"no": 212, "time": "00:18:39", "speaker": "老师", "text": "唉是的，原来这个老婆婆看戏的时候还带着饭，啊为什么她要带着饭？"}, {"no": 213, "time": "00:18:46", "speaker": "学生3", "text": "因为这样别人饿了就可以找这里的老婆婆要饭了，"}, {"no": 214, "time": "00:18:53", "speaker": "老师", "text": "你是这么想的，你觉得"}, {"no": 215, "time": "00:18:56", "speaker": "学生2", "text": "我就是感觉她就是个打着饭就就要看上一天，"}, {"no": 216, "time": "00:19:01", "speaker": "老师", "text": "从早看到晚连吃饭的时间都不想错过是吧？"}, {"no": 217, "time": "00:19:06", "speaker": "老师", "text": "是呀这个老婆婆原来她也那么爱看戏，关于这一页你们还想分享些什么？呢你来说，你来补充。"}, {"no": 218, "time": "00:19:17", "speaker": "学生3", "text": "他们那里的房子都是很古老的，"}, {"no": 219, "time": "00:19:20", "speaker": "学生1", "text": "噢"}, {"no": 220, "time": "00:19:22", "speaker": "老师", "text": "你想要介绍荷花镇的另外一个特点了，是吧？好，行，那我们关于噢一个一个来嗯关于荷花镇的戏台子，我们就介绍到这里，刚才金丝雨你来告诉大家，你来翻出来，他说荷花镇还是一个很古老的地方，古老在哪里呢？这一页能说明它足够古老，在哪里？"}, {"no": 221, "time": "00:19:51", "speaker": "学生3", "text": "因为他们的"}, {"no": 222, "time": "00:19:52", "speaker": "老师", "text": "什么东西看上去足够古老，"}, {"no": 223, "time": "00:19:54", "speaker": "学生3", "text": "因为他们的屋顶上面是用瓦片盖成的，我们城市里的房子都是用嗯砖块盖成的，屋顶，它们是三角形的，我们是平平"}, {"no": 224, "time": "00:20:09", "speaker": "学生1", "text": "的，"}, {"no": 225, "time": "00:20:09", "speaker": "老师", "text": "它是从这些房子的屋顶，它的瓦，它的形状来判断，不是我们这个年代的房子，是吧？"}, {"no": 226, "time": "00:20:18", "speaker": "老师", "text": "噢你可真有一双智慧的眼睛，你比出来了，从房子可以看出来，那是一个古老的地方，还有补充吗？哪里也能看出它的古老？"}, {"no": 227, "time": "00:20:28", "speaker": "学生2", "text": "因为他们的房子都是在水水的旁边做成的，"}, {"no": 228, "time": "00:20:36", "speaker": "老师", "text": "它是用什么搭上来的？建在水边的。"}, {"no": 229, "time": "00:20:43", "speaker": "学生4", "text": "嗯"}, {"no": 230, "time": "00:20:43", "speaker": "老师", "text": "你想你就是想说它是一个依水而建的小镇是吧？好，我把你的这个也拿出来，它不仅房子看上去很古老，而且它还是一个建在水边的，可以说依水而建的小镇，它的房子还有什么特点？谁再来介绍一下？你来说"}, {"no": 231, "time": "00:21:06", "speaker": "学生2", "text": "它的房子旁边是有一个楼梯可以。嗯下句是通往水的，如果一一个船过来了，如果那个人要乘船的话，就可以就可以从那个楼梯走下去到船上。"}, {"no": 232, "time": "00:21:25", "speaker": "老师", "text": "你说的是这个楼梯是吗？是不是？这里你连这里的人他们的生活习惯都看懂了，他们出行就是从这里来的。"}, {"no": 233, "time": "00:21:36", "speaker": "老师", "text": "唉书里是不是有一句话来介绍这里的人他们是怎么样在荷花镇这个水乡生活的？呢谁记得那句话？你来说。"}, {"no": 234, "time": "00:21:49", "speaker": "学生2", "text": "水就是路，船，就是车"}, {"no": 235, "time": "00:21:52", "speaker": "老师", "text": "是哪一句给它标出来？来，妹妹，你。"}, {"no": 236, "time": "00:22:00", "speaker": "老师", "text": "去，你们这句话看到了吗？好，我要想来考考你们，啊除了这个文字上说了荷花镇"}, {"no": 237, "time": "00:22:09", "speaker": "学生1", "text": "它"}, {"no": 238, "time": "00:22:10", "speaker": "老师", "text": "河就是路，船就是车，书本当中的哪一些画面也能够让我们读懂这个地方它的特点，这个特点谁来翻给我？看还是近似于吗？你会从哪里开始介绍呢？它的特点还是这一页，是的，除了这一页还有吗？没错，在这一页我们看到了船，看到了河，还有他们说还有"}, {"no": 239, "time": "00:22:42", "speaker": "学生1", "text": "这里这"}, {"no": 240, "time": "00:22:43", "speaker": "老师", "text": "一页也是看到了河是吧？好，赶紧谁还想来翻，不是这页你来，你来翻。"}, {"no": 241, "time": "00:22:53", "speaker": "老师", "text": "刚才你们翻的是这一页对吗？"}, {"no": 242, "time": "00:23:02", "speaker": "学生1", "text": "还有这一页"}, {"no": 243, "time": "00:23:03", "speaker": "老师", "text": "噢还有这一页我也给它拿出来，这一页也能看清楚，那是一个水乡的小镇，还有吗还有吗？来你来谢来你来。"}, {"no": 244, "time": "00:23:19", "speaker": "学生4", "text": "看见"}, {"no": 245, "time": "00:23:20", "speaker": "老师", "text": "哇看到了河那么多的河，每甚至每一页都有大大小小的河流，难怪你们说它是一个建在水边的小镇。"}, {"no": 246, "time": "00:23:33", "speaker": "老师", "text": "唉刚才我们介绍了荷花镇，它是一个依水而建的古老的又热闹的小镇，你觉得它还是一个幸福的小镇，是吧？"}, {"no": 247, "time": "00:23:48", "speaker": "老师", "text": "哎在这本书上你还能找到幸福，啊好，我把它拿出来，你来告诉我们哪里可以看出来荷花镇的幸福，呢去吧看看他找到的幸福和你们觉得幸福是在同一页上吗？你记得幸福的那件事情"}, {"no": 248, "time": "00:24:15", "speaker": "学生3", "text": "吗？结婚的那一页，"}, {"no": 249, "time": "00:24:17", "speaker": "老师", "text": "他说是结婚的那一页，谁能很快的迅速的帮他翻到那一页？"}, {"no": 250, "time": "00:24:21", "speaker": "老师", "text": "陶然你来。看看你们觉得幸福的那一页，够幸福吗？"}, {"no": 251, "time": "00:24:31", "speaker": "学生1", "text": "嗯"}, {"no": 252, "time": "00:24:32", "speaker": "老师", "text": "够幸福，结婚就一定是一件幸福的事情，找到了吗？好，我也给它放大，是这一页对吧？对，孩子们结婚在哪里就一起告诉我，不用举手告诉我"}, {"no": 253, "time": "00:24:43", "speaker": "学生1", "text": "在旁边。"}, {"no": 254, "time": "00:24:47", "speaker": "老师", "text": "在这里是吧？"}, {"no": 255, "time": "00:24:48", "speaker": "学生1", "text": "好，"}, {"no": 256, "time": "00:24:50", "speaker": "老师", "text": "这里的结婚让你觉得很幸福，谁能把他的幸福说的再具体一点？你来说，"}, {"no": 257, "time": "00:24:58", "speaker": "学生2", "text": "因为他们结婚了，"}, {"no": 258, "time": "00:25:00", "speaker": "老师", "text": "是呀这件事情就很幸福了，还可以从哪里看出来？"}, {"no": 259, "time": "00:25:03", "speaker": "老师", "text": "你说"}, {"no": 260, "time": "00:25:04", "speaker": "学生2", "text": "我看出来了，这户人家是前不久才结过婚，所以呢他们举着那个结婚的"}, {"no": 261, "time": "00:25:14", "speaker": "老师", "text": "牌子，你们听得懂他说的那个意思吗？他说前不久他们家里就有喜事，或者是说他们为了结婚这件事情，你是从哪里看出来的？他们家有什么特点，什么字？在哪里啊在哪里来找出来这户结婚的人在前面就有看到是吧？你看书的时候是会前后连在一起看的"}, {"no": 262, "time": "00:25:46", "speaker": "学生1", "text": "好，"}, {"no": 263, "time": "00:25:47", "speaker": "老师", "text": "我我也我们一起来帮他找。"}, {"no": 264, "time": "00:25:49", "speaker": "老师", "text": "啊你们有印象吗？那一页是在哪是在这里吗？这里的什么地方贴的喜字？啊"}, {"no": 265, "time": "00:26:01", "speaker": "学生2", "text": "这个窗户上"}, {"no": 266, "time": "00:26:04", "speaker": "老师", "text": "贴了红红的双喜，是呀看到这个我们就觉得心里很幸福的，是吗？好，回到刚才这一页，唉办喜事，结婚确实是一件幸福的事情，那在这一页你还能找到别的幸福吗？还有幸福的地方，你能介绍给我们听吗？你来说。"}, {"no": 267, "time": "00:26:26", "speaker": "学生2", "text": "嗯我刚才看到唉看见"}, {"no": 268, "time": "00:26:29", "speaker": "老师", "text": "哇你都想跳过去了，"}, {"no": 269, "time": "00:26:30", "speaker": "学生2", "text": "你那里有两个人在乘船，我感觉他们两个也很幸福，"}, {"no": 270, "time": "00:26:34", "speaker": "老师", "text": "噢两个人依偎在一起就是幸福的感受没错的没错的。"}, {"no": 271, "time": "00:26:41", "speaker": "老师", "text": "你说嗯"}, {"no": 272, "time": "00:26:43", "speaker": "学生2", "text": "那里还有洋洋和他的姑姑到那里还碰见了老还碰见他们家奶奶的朋友张阿婆了，"}, {"no": 273, "time": "00:26:54", "speaker": "老师", "text": "他在这里就找到了张阿婆，哪个是张阿婆？他说这个是张阿婆同意吗？他不同意陶然，你们觉得哪张阿婆是哪个？"}, {"no": 274, "time": "00:27:09", "speaker": "学生1", "text": "啊"}, {"no": 275, "time": "00:27:10", "speaker": "老师", "text": "好，你来你来一个一个来。我给他放大。"}, {"no": 276, "time": "00:27:17", "speaker": "老师", "text": "噢这个是张阿婆是吧？你是怎么判断出来的？呢"}, {"no": 277, "time": "00:27:23", "speaker": "学生1", "text": "他告诉你。"}, {"no": 278, "time": "00:27:26", "speaker": "老师", "text": "嗯因为他的头转过去跟他在讲话是吧？谁记得当时他们讲了什么话，他们的对话让你觉得很温暖的是吧？很幸福的，那么说说看他他们讲了些什么，呢请坐。"}, {"no": 279, "time": "00:27:40", "speaker": "学生3", "text": "他说的是"}, {"no": 280, "time": "00:27:41", "speaker": "学生4", "text": "嗯嗯"}, {"no": 281, "time": "00:27:43", "speaker": "学生3", "text": "今天是嗯"}, {"no": 282, "time": "00:27:46", "speaker": "老师", "text": "谁说的这句话？"}, {"no": 283, "time": "00:27:48", "speaker": "学生3", "text": "嗯这是他姑姑说的，他说今天是老奶奶的嗯7过70大寿，你要早点来，然后呢张阿婆说，嗯嗯我还我还给老奶奶给老奶奶酿了自己老奶奶爱喝的嗯自己做的米酒。"}, {"no": 284, "time": "00:28:14", "speaker": "老师", "text": "噢张阿婆给老太太准备了她自己做的米酒，那你们猜猜看。当老太太收到了张阿婆的礼物，收到了她的祝福的时候，老太太的心里感受是怎么样的？"}, {"no": 285, "time": "00:28:31", "speaker": "学生1", "text": "很"}, {"no": 286, "time": "00:28:31", "speaker": "学生2", "text": "幸福、很开心、很幸福、"}, {"no": 287, "time": "00:28:33", "speaker": "老师", "text": "开心的、幸福的，还有呢"}, {"no": 288, "time": "00:28:35", "speaker": "学生2", "text": "很快乐"}, {"no": 289, "time": "00:28:36", "speaker": "老师", "text": "很快乐的。还有呢？"}, {"no": 290, "time": "00:28:39", "speaker": "学生2", "text": "很温暖"}, {"no": 291, "time": "00:28:39", "speaker": "老师", "text": "很温暖的是呀如果我们过生日的时候，有朋友那么惦记着我，一定是一件幸福的事情，唉这本书上的温暖与幸福，老老师也想来和你们分享一页，你们猜我分享的这一页是什么？呢你们有看到过吗？猜猜看，为什么？我觉得这一幅上面他就足够幸福？"}, {"no": 292, "time": "00:29:10", "speaker": "老师", "text": "说说看你的理由，你来说。"}, {"no": 293, "time": "00:29:13", "speaker": "学生2", "text": "因为这里有很很好看的奶油蛋糕，老太太看见一定感觉她很幸福，"}, {"no": 294, "time": "00:29:23", "speaker": "老师", "text": "没错的，我也是这么想的，有蛋糕，老太太过生日的那个人就是觉得心里甜甜的，还有吗？你说"}, {"no": 295, "time": "00:29:31", "speaker": "学生1", "text": "老"}, {"no": 296, "time": "00:29:32", "speaker": "学生2", "text": "老太太太。老太太觉得的这一桌美食看起来都很好吃，"}, {"no": 297, "time": "00:29:41", "speaker": "老师", "text": "嗯食物那么丰盛，就是幸福生活的象征，还有吗？"}, {"no": 298, "time": "00:29:47", "speaker": "学生2", "text": "这些好吃的很多很多开，他应该会很吃惊，"}, {"no": 299, "time": "00:29:52", "speaker": "老师", "text": "没错的，有好吃的就是一种幸福的感受。"}, {"no": 300, "time": "00:29:56", "speaker": "老师", "text": "你觉得这个圆桌可能换来哪些人？"}, {"no": 301, "time": "00:30:00", "speaker": "学生4", "text": "嗯"}, {"no": 302, "time": "00:30:02", "speaker": "学生2", "text": "有有很多人这这些圆桌上面的东西老太太会喜欢。"}, {"no": 303, "time": "00:30:13", "speaker": "老师", "text": "嗯没错的，因为给老太太过寿，所以大家都为她准备了她喜欢的东西，"}, {"no": 304, "time": "00:30:19", "speaker": "学生2", "text": "因为桌上都有老太太爱吃的东西，有鱼、有蛋糕、有肉，"}, {"no": 305, "time": "00:30:27", "speaker": "学生3", "text": "什么都有。"}, {"no": 306, "time": "00:30:29", "speaker": "老师", "text": "嗯是，呀没错，你们讲的都很对，我们中国人在什么时候会坐上这张圆桌？你们有坐过这样的圆桌吗？"}, {"no": 307, "time": "00:30:39", "speaker": "学生1", "text": "有什么"}, {"no": 308, "time": "00:30:40", "speaker": "老师", "text": "时候会坐上这张圆桌？你说。"}, {"no": 309, "time": "00:30:43", "speaker": "学生1", "text": "嗯"}, {"no": 310, "time": "00:30:44", "speaker": "学生2", "text": "每次我去吃饭的时候我们是随便乱跳的，然后就看到一个圆桌就坐下来，"}, {"no": 311, "time": "00:30:51", "speaker": "老师", "text": "这个圆桌是周边可以坐的人多不多？"}, {"no": 312, "time": "00:30:54", "speaker": "学生2", "text": "唉多的"}, {"no": 313, "time": "00:30:55", "speaker": "老师", "text": "很多的很多的人聚在一起，那就叫一个字，谁一个词谁会说，很多的人团在一起坐在一起，我们可以说那看中国人就喜欢团团圆圆，团团圆圆就是中国人的幸福是吧？没错的，所以在这一页上"}, {"no": 314, "time": "00:31:15", "speaker": "学生1", "text": "噢"}, {"no": 315, "time": "00:31:16", "speaker": "老师", "text": "我们把他的幸福是的，你肯定也是一个幸福的家庭。好，孩子们分享到这里，我们都说荷花镇他有那4个特点，如果有人再来问你，你就可以告诉他，但是呢我相信这本书如果我们再一次去看去读，你还会发现荷花镇里面那些有趣的事情和有趣的人。下一次我们再来讲一讲。"}]}, "assessment": {"sections": [{"id": "pre", "title": "一、活动前：趣学预设", "columns": ["评估维度", "评估指标", "所见所思"], "dimensions": [{"id": "pre.1", "name": "目标制定", "coreQuestion": null, "groups": [{"label": "评估指标", "items": [{"text": "目标符合幼儿年龄特点与已有经验，体现领域核心经验，突出活动重点", "name": "目标制定", "kind": "PLAN", "kindLabel": "需看教案", "rows": [], "unavailable": [], "note": "需要教师的活动方案/教案，对照目标表述与环节设计。录像音频 view": true, "diarization": true, "irf_role": "F-ext"}, {"id": 9, "start": 284.0, "end": null, "speaker": "T", "text": "好速度快，大班的孩子就是不一样。啊哇塞，你们看看现在我们的展示架上是不是都是你们最喜欢的种子？啦是的，谁想第一个来介绍一下你喜欢它的理由？这么多小手，我请谁？来请你。来，你的种子是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 10, "start": 313.0, "end": null, "speaker": "S2", "text": "我的种子，是这个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 11, "start": 315.0, "end": null, "speaker": "T", "text": "哇来把它拿下来来，我们一起展示给小朋友看看，给好朋友看一看，这是他的选择。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 12, "start": 326.0, "end": null, "speaker": "T", "text": "他可宝贝可宝贝，喽好，唉呦抓紧时间来让他闪亮登台来说说你的介绍。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 13, "start": 343.0, "end": null, "speaker": "S2", "text": "因为他重重的因为他重重地", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 14, "start": 350.0, "end": null, "speaker": "T", "text": "重重地你是怎么感受到他是，种种的呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 15, "start": 354.0, "end": null, "speaker": "S2", "text": "我是用手用手", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 16, "start": 356.0, "end": null, "speaker": "T", "text": "怎么样？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 17, "start": 358.0, "end": null, "speaker": "S2", "text": "我是用手拿着晃了晃，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 18, "start": 363.0, "end": null, "speaker": "T", "text": "看看，这就是你选择它的理由吗？噢因为用手能感受到它的重量，所以坚定的选择了它，真好，有没有跟它选择一样的小朋友？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 19, "start": 379.0, "end": null, "speaker": "T", "text": "谢谢你这颗种子有没有跟他选择一样的小朋友？好。来，请你来，男孩你选择的理由是什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 20, "start": 388.0, "end": null, "speaker": "S1", "text": "他", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 21, "start": 390.0, "end": null, "speaker": "S3", "text": "比较软，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 22, "start": 392.0, "end": null, "speaker": "S1", "text": "噢你", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 23, "start": 393.0, "end": null, "speaker": "T", "text": "是怎么感受到的？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 24, "start": 395.0, "end": null, "speaker": "S3", "text": "捏了。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 25, "start": 397.0, "end": null, "speaker": "T", "text": "还有想说的吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 26, "start": 399.0, "end": null, "speaker": "S3", "text": "嗯它像吃的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 27, "start": 402.0, "end": null, "speaker": "T", "text": "看起来像吃的，而且用小手感受到了它的软度，是不是？谢谢你的分享，原来小手可真灵巧，来你来女孩你的种子是。来赶快展示给小朋友看看，走", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 28, "start": 424.0, "end": null, "speaker": "S1", "text": "这么稀有，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 29, "start": 427.0, "end": null, "speaker": "T", "text": "啊没看到过，啊秀一下你的最爱的种子。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 30, "start": 432.0, "end": null, "speaker": "T", "text": "好，那我们来仔细听听噢他选择的理由是什么？来，我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 31, "start": 441.0, "end": null, "speaker": "S2", "text": "选择的理由是它像个花，而且香香的尖尖的开的很美丽，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 32, "start": 448.0, "end": null, "speaker": "T", "text": "噢这就是你的理由，看看原来眼睛看到了它像什么？鼻子闻到了它的味道，唉呦我们大班的小朋友观察的方法可真多。呀还有呢赶快来，我来看看啊请哪位小朋友我的小话筒要过来，喽请你说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 33, "start": 474.0, "end": null, "speaker": "S1", "text": "我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 34, "start": 476.0, "end": null, "speaker": "S3", "text": "的是这个种子", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 35, "start": 478.0, "end": null, "speaker": "T", "text": "啊来。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 36, "start": 482.0, "end": null, "speaker": "T", "text": "选择的理由是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 37, "start": 483.0, "end": null, "speaker": "S3", "text": "选择的理由是它像个桃子，而且呢外面像巧克力粉，它看它的我摸的时候有有一点", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 38, "start": 498.0, "end": null, "speaker": "T", "text": "粗糙看，眼睛看到了它独特的造型，这是他观察到的小手也派上用场了，这种感觉是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 39, "start": 507.0, "end": null, "speaker": "S1", "text": "很", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 40, "start": 507.0, "end": null, "speaker": "S3", "text": "美妙的感觉，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 41, "start": 509.0, "end": null, "speaker": "T", "text": "唉呦我听你介绍也觉得美妙，送回去再来小米，速度快带上你的种子。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 42, "start": 520.0, "end": null, "speaker": "T", "text": "说说选择的理由", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 43, "start": 523.0, "end": null, "speaker": "S3", "text": "就是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 44, "start": 524.0, "end": null, "speaker": "S2", "text": "嗯我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 45, "start": 526.0, "end": null, "speaker": "S3", "text": "我的理由是嗯它像我最爱吃的豌豆，而且是绿色", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 46, "start": 535.0, "end": null, "speaker": "T", "text": "的眼睛看到的颜色，喜欢吃的食物也能够联想起来，真不错，谢谢你的分享。唉呀我再来请一位小朋友来，女孩大步走，有精神嗯登场，登登来。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 47, "start": 557.0, "end": null, "speaker": "S2", "text": "夜莺呢它光滑滑的，而且它是一个人你你你看到一个什么东西他他会他会在你里面都在里面弄出来的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 48, "start": 576.0, "end": null, "speaker": "T", "text": "噢里面可能还有秘密是吧？噢他是用小手摸出来感受到了它光滑的触感。真好，有没有跟他选择一样的小伙伴来补充？来，蒋一涵来。嗯来来来，你有你你有什么想说的吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 49, "start": 596.0, "end": null, "speaker": "S2", "text": "我感觉它像宝石", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 50, "start": 599.0, "end": null, "speaker": "S1", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 51, "start": 599.0, "end": null, "speaker": "T", "text": "它", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 52, "start": 599.0, "end": null, "speaker": "S2", "text": "光滑滑", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 53, "start": 602.0, "end": null, "speaker": "T", "text": "的看看，用眼睛发现了它独有的外形造型有意思，啊来，陈涵。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 54, "start": 613.0, "end": null, "speaker": "T", "text": "好的，带着你的宝贝它可珍贵了，噢轻轻的听听它的介绍，噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 55, "start": 622.0, "end": null, "speaker": "S2", "text": "因为我知道它们怎么生长出来的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 56, "start": 628.0, "end": null, "speaker": "S1", "text": "噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 57, "start": 630.0, "end": null, "speaker": "T", "text": "怎么生长出来都知道啊你是怎么知道的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 58, "start": 634.0, "end": null, "speaker": "S2", "text": "呢我在我老家种过花生", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 59, "start": 638.0, "end": null, "speaker": "T", "text": "的，看看生活中的观察，小能手唉经历过的都能够记在心里，那你给我们介绍一下。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 60, "start": 645.0, "end": null, "speaker": "S2", "text": "首先它在泥土里面会慢慢的发芽，发芽成很大了之后，会有一个小根子钻到泥土里面，后面花生就会慢慢的慢慢的长大长大了之后树叶变黄了，就能就能摘出来了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 61, "start": 671.0, "end": null, "speaker": "T", "text": "此处要有掌声太厉害了，陈涵能够根据自己长时间的一个观察，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 62, "start": 683.0, "end": null, "speaker": "S3", "text": "唉", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 63, "start": 684.0, "end": null, "speaker": "T", "text": "坚定的选择这颗种子。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 64, "start": 686.0, "end": null, "speaker": "T", "text": "大班的孩子就是不一样，确实有的时候观察不是一会会是需要一直坚持的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 65, "start": 696.0, "end": null, "speaker": "T", "text": "再来一位女孩速度快，说说你的理由，我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 66, "start": 710.0, "end": null, "speaker": "S2", "text": "的种子像花生那个皮厚厚的，啊它外面还有很多的壳，现在把那个壳啊掰开了，成了这样的小种子，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 67, "start": 728.0, "end": null, "speaker": "T", "text": "噢谢谢你的分享非常的清楚，来吧，最后再请一位晨晨来介绍一下你的种子特别在哪里，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 68, "start": 741.0, "end": null, "speaker": "S3", "text": "我这个有点像树叶，然后下面有条纹，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 69, "start": 748.0, "end": null, "speaker": "T", "text": "嗯花纹也能通过眼睛看得清清楚楚的，谢谢你的分享。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 70, "start": 755.0, "end": null, "speaker": "T", "text": "孩子们刚才啊你们真的很了不起，能自己去观察，自己去选择，还能够清楚的把自己最喜欢的种子它的特点，用手、用眼睛、用鼻子、用时间等等等等的方法把它介绍的清清楚楚的，让老师给你们点赞，对，唉那既然有这么多的虫子，你们的在这了我也有一颗最喜欢的，想不想知道？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 71, "start": 796.0, "end": null, "speaker": "T", "text": "啊猜一猜啊里面白白的，它是小小的，嗯有点弯弯的，像小月亮一样的，你们知道是什么？可惜了。不对，你们知道是什么吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 72, "start": 820.0, "end": null, "speaker": "S1", "text": "香蕉", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 73, "start": 821.0, "end": null, "speaker": "T", "text": "是一颗蚕，唉所以有的它就是那么神奇，有的种子形状很相似，颜色很相似，但实际上可能我们喜欢的是它不同的特点，对不对？嗯那既然有那么多的种子，想不想和他们来玩游戏？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 74, "start": 847.0, "end": null, "speaker": "T", "text": "想看看给你们准备了那么多材料，你的种子想和哪些材料来玩，怎么样的游戏？想一想。你说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 75, "start": 856.0, "end": null, "speaker": "S1", "text": "我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 76, "start": 857.0, "end": null, "speaker": "S2", "text": "想跟那个水的那个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 77, "start": 864.0, "end": null, "speaker": "T", "text": "好的，我期待你的发现，来你说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 78, "start": 867.0, "end": null, "speaker": "S2", "text": "我我想跟它玩滑滑梯滑下来，而且掉在下面还是水，然后我们我给它抛水，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 79, "start": 878.0, "end": null, "speaker": "T", "text": "噢听着有意思，那等会儿我们就用自己的种子和这些材料玩一玩，有要求的，有挑战的哦哎这张记录纸谁看懂了？你说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 80, "start": 897.0, "end": null, "speaker": "S2", "text": "它是你选择了哪个工具要在下面打勾，嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 81, "start": 902.0, "end": null, "speaker": "T", "text": "那是那下面放大镜的部分，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 82, "start": 906.0, "end": null, "speaker": "S2", "text": "呢你放大镜下面的是你观察到了哪些要画出来，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 83, "start": 913.0, "end": null, "speaker": "T", "text": "把观察到的秘密记录下来，谢谢你的分享，听明白了吗？听等会儿结束以后，带着你的记录纸和种子回到前面来，听明白了就来行动，吧轻轻的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 84, "start": 932.0, "end": null, "speaker": "S2", "text": "我的呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 85, "start": 934.0, "end": null, "speaker": "S1", "text": "我的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 86, "start": 975.0, "end": null, "speaker": "T", "text": "狮子别忘了把发现记录下来，哦期待你们的发现，啊你发现了什么，呢然后呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 87, "start": 1009.0, "end": null, "speaker": "S1", "text": "能不能", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 88, "start": 1011.0, "end": null, "speaker": "T", "text": "噢我看看能不能调出来这个玩法，我第一次听说唉那你是用它的什么特点来玩的？可以，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 89, "start": 1029.0, "end": null, "speaker": "S1", "text": "你", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 90, "start": 1031.0, "end": null, "speaker": "T", "text": "发现了吗？有的小伙伴已经发现了一种秘密，正在尝试第二种游戏，发现第二种秘密，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 91, "start": 1049.0, "end": null, "speaker": "S1", "text": "呢你很滑滑梯，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 92, "start": 1066.0, "end": null, "speaker": "T", "text": "你看到了它的什么？赶快记录下来。呐", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 93, "start": 1082.0, "end": null, "speaker": "S2", "text": "干嘛？呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 94, "start": 1083.0, "end": null, "speaker": "T", "text": "你在玩什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 95, "start": 1086.0, "end": null, "speaker": "S1", "text": "游戏，我们就这样玩，把它给弄到水里，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 96, "start": 1091.0, "end": null, "speaker": "T", "text": "噢你们是一起玩是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 97, "start": 1093.0, "end": null, "speaker": "S1", "text": "吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 98, "start": 1093.0, "end": null, "speaker": "T", "text": "噢你已经迫不及待想要分享了，这个很正常，我们玩游戏去发现就会有各种各样的意外，啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 99, "start": 1103.0, "end": null, "speaker": "S2", "text": "没同意他。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 100, "start": 1107.0, "end": null, "speaker": "T", "text": "玩那我们小朋友之间是不是可以商量一下嗯大班的孩子了，自己解决你发现了他的什么秘密？你刚刚飞的时候发现它什么样的秘密？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 101, "start": 1128.0, "end": null, "speaker": "S3", "text": "它滑的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 102, "start": 1130.0, "end": null, "speaker": "T", "text": "噢为什么它会快？呢等会我期待你的分享啊啊它飞的时候会有什么样的感觉？那赶快记录下你的。发现还有一分钟的时间。没关系，小事情玩得开心，有发现就。好，有的小朋友已经有三种玩法和发现喽他是浮起来还是怎么样？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 103, "start": 1191.0, "end": null, "speaker": "S1", "text": "我的没有浮起来，我的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 104, "start": 1196.0, "end": null, "speaker": "T", "text": "好，那为什么会滑不下去？浮不起来，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 105, "start": 1199.0, "end": null, "speaker": "S1", "text": "因为它的摩擦力小，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 106, "start": 1201.0, "end": null, "speaker": "T", "text": "噢你是这样发现的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 107, "start": 1203.0, "end": null, "speaker": "S1", "text": "对是摩擦力极小，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 108, "start": 1204.0, "end": null, "speaker": "T", "text": "好，等会我们来分享。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 109, "start": 1205.0, "end": null, "speaker": "T", "text": "啊好，宝贝们时间差不多了，游戏的时光就是短暂的，来吧，我们等会儿可以继续玩，带着你的种子和记录表回到展台前，已经好了的小朋友我们抓紧时间回来，哇速度很快，来吧，我们要来分享，喽哇有的小朋友真的是小眼睛小脑筋都动得", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 110, "start": 1258.0, "end": null, "speaker": "S3", "text": "很快，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 111, "start": 1259.0, "end": null, "speaker": "T", "text": "噢没事记在心里也可以分享好了，宝贝们，刚刚你们在玩游戏的时候有不同的玩法，不同的发现谁能先来分享？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 112, "start": 1272.0, "end": null, "speaker": "T", "text": "我请。来，你来，吧陈晨。你的是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 113, "start": 1279.0, "end": null, "speaker": "S3", "text": "嗯这个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 114, "start": 1280.0, "end": null, "speaker": "T", "text": "啊这颗种子这个记录表对吗？我当他的小助手啊来介绍一下你的发现，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 115, "start": 1287.0, "end": null, "speaker": "S3", "text": "我扔的时候上面上面不转，下面才转，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 116, "start": 1294.0, "end": null, "speaker": "T", "text": "转动的样子是不一样的，掌声呀不仅会玩，还会发现还有什么想说的吗？噢没有了，有没有人谁也玩了这颗种子？噢来，你来说你玩的时候他是什么样的？话筒给他玩", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 117, "start": 1320.0, "end": null, "speaker": "S2", "text": "的时候，它它一个叶子就断了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 118, "start": 1324.0, "end": null, "speaker": "T", "text": "是呀种子有时候有点脆弱，我们需要细心的呵护它，嗯你也给到了我们一个小提示，真好，谢谢你。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 119, "start": 1335.0, "end": null, "speaker": "T", "text": "原来种有的种子飞落的状态是不一样的，啊来再来分享你的哪一张速度快，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 120, "start": 1346.0, "end": null, "speaker": "S2", "text": "是这一张。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 121, "start": 1348.0, "end": null, "speaker": "T", "text": "好，来，你说我当你的小助手，请坐。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 122, "start": 1355.0, "end": null, "speaker": "S2", "text": "我的两个种子不同，一个跑得快，一个跑得慢，而且有一个不用手推，有一个要手推。噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 123, "start": 1366.0, "end": null, "speaker": "T", "text": "同种种子也有不同的变化，你为什么会这样你知道", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 124, "start": 1373.0, "end": null, "speaker": "S2", "text": "吗？因为有一个有比那个圆一些，有一个不圆，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 125, "start": 1379.0, "end": null, "speaker": "T", "text": "看来种子的形状跟滚落是有关系的是这个意思吗？谢谢他的分享谢谢你，来再来继续。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 126, "start": 1390.0, "end": null, "speaker": "T", "text": "大米大米今天第一次举手啊表扬，来。你是哪一科？哦好的。这个吗？嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 127, "start": 1402.0, "end": null, "speaker": "S3", "text": "我的是嗯它我垫了一个滑坡，嗯它滑的速度很快，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 128, "start": 1412.0, "end": null, "speaker": "T", "text": "为什么会快？跟它的什么特点可能有关系，呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 129, "start": 1415.0, "end": null, "speaker": "S2", "text": "因为它很圆，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 130, "start": 1418.0, "end": null, "speaker": "S3", "text": "所以它才划得很快，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 131, "start": 1421.0, "end": null, "speaker": "T", "text": "噢你们觉得是这样吗？谁还有补充吗？来，你来补充。来，你来说说看。你觉得它为什么会滑的挺快的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 132, "start": 1434.0, "end": null, "speaker": "S2", "text": "因为它很圆，而且它虽然有点不光滑，但它只有一点点，但也能因为那个板子也是平平的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 133, "start": 1446.0, "end": null, "speaker": "T", "text": "看来跟材料有关，跟它外形的这种特征是有关系的，是这个意思吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 134, "start": 1453.0, "end": null, "speaker": "T", "text": "谢谢你的补充，看看跟好伙伴一起玩游戏真的很有意思，再来，谁能说说你的发现？来，请你。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 135, "start": 1463.0, "end": null, "speaker": "S2", "text": "说我的我的是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 136, "start": 1466.0, "end": null, "speaker": "T", "text": "来到前面，嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 137, "start": 1467.0, "end": null, "speaker": "S2", "text": "我的是这个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 138, "start": 1469.0, "end": null, "speaker": "T", "text": "嗯好的，你的种子是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 139, "start": 1471.0, "end": null, "speaker": "S2", "text": "我的种子是尖尖的，我陪陈涵和大牛牛一起玩，陈涵的可以划，我的划不下来，大牛牛的也划不", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 140, "start": 1485.0, "end": null, "speaker": "T", "text": "下来，看看，不仅自己玩，还和朋友的种子一起对比了一下，噢那为什么会有这样的情况呢？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 141, "start": 1493.0, "end": null, "speaker": "S2", "text": "因为我们俩的摩擦力", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 142, "start": 1496.0, "end": null, "speaker": "T", "text": "噢摩擦力怎么样？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 143, "start": 1499.0, "end": null, "speaker": "S2", "text": "不好，不光滑，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 144, "start": 1501.0, "end": null, "speaker": "T", "text": "这跟种子的什么特点有有关系？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 145, "start": 1504.0, "end": null, "speaker": "S2", "text": "啊因为它本身没水，而且还尖尖的，那", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 146, "start": 1509.0, "end": null, "speaker": "T", "text": "你觉得水的作用是什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 147, "start": 1511.0, "end": null, "speaker": "S2", "text": "水的作用可以让它更光滑滑的更", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 148, "start": 1516.0, "end": null, "speaker": "T", "text": "快，还有想说的吗？来，跟他一起玩的小朋友有没有补充的？陈涵。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 149, "start": 1525.0, "end": null, "speaker": "T", "text": "牛牛也到前面来，你有什么想补充的说？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 150, "start": 1528.0, "end": null, "speaker": "S1", "text": "我先帮女生吧", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 151, "start": 1529.0, "end": null, "speaker": "T", "text": "噢哟女士优先啊点赞，来说你们玩的时候", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 152, "start": 1534.0, "end": null, "speaker": "S2", "text": "我们玩的时候她们也拿了种子划，没有我划的第一个种子划得快，它们两个的种子可以在水里跟我一样漂浮起来，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 153, "start": 1551.0, "end": null, "speaker": "S1", "text": "还", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 154, "start": 1552.0, "end": null, "speaker": "T", "text": "玩了水里的游戏能够浮起来，这个好像是一个新的发现新的现象，啊你来补充。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 155, "start": 1562.0, "end": null, "speaker": "S2", "text": "我跟陈涵和叶美琪我的是用手推，然后叶美琪的滑不上去，然后陈涵的滑的下去，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 156, "start": 1574.0, "end": null, "speaker": "T", "text": "看看同一种种子也好，不同的种子也好，不一样的玩法就会有不一样的发现。刚刚有的小朋友说我的种子滑落的时候，速度有快也有也有慢，这是你用眼睛去发现，用小手去配合的。还有的小朋友说唉放在水里好像会怎么样？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 157, "start": 1603.0, "end": null, "speaker": "S2", "text": "神奇。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 158, "start": 1604.0, "end": null, "speaker": "T", "text": "噢有发现浮起来的，还有没有发现？嘴巴说出来有些会浮起来，而有一些可能会沉，对沉下去真是不一样的发现。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 159, "start": 1627.0, "end": null, "speaker": "T", "text": "听到小伙伴的想法了吗？可能跟他的轻重有关系，那你怎么能发现他的轻重呢？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 160, "start": 1635.0, "end": null, "speaker": "S2", "text": "因为我我发现陈涵的浮起来了，大妞妞的就沉下去了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 161, "start": 1642.0, "end": null, "speaker": "T", "text": "噢这两颗种子你有没有比过谁重谁轻，啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 162, "start": 1646.0, "end": null, "speaker": "S2", "text": "我倒是摸过大牛牛的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 163, "start": 1650.0, "end": null, "speaker": "T", "text": "噢用摸的方式来猜测和", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 164, "start": 1653.0, "end": null, "speaker": "S2", "text": "推理，我知道我和大牛牛的谁重，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 165, "start": 1657.0, "end": null, "speaker": "T", "text": "嗯什么方法，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 166, "start": 1658.0, "end": null, "speaker": "S1", "text": "我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 167, "start": 1658.0, "end": null, "speaker": "S2", "text": "用手两个都拿起来了，果是大妞妞的比较重一点，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 168, "start": 1667.0, "end": null, "speaker": "T", "text": "小手还能帮我们掂一掂，感受独特的重量。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 169, "start": 1673.0, "end": null, "speaker": "T", "text": "还有的小朋友刚刚在分享的时候也说了，唉有的种子啊它还会飞起来，而且滚落的状态也都是不一样的。孩子们你们一定还有很多的发现，我们等会继续聊好不好？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 170, "start": 1694.0, "end": null, "speaker": "S1", "text": "好。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 171, "start": 1696.0, "end": null, "speaker": "T", "text": "唉呀聊了这么多，玩了那么多的游戏和种子玩游戏的时候，你有什么样的感受？呢等会再来分享，不着急有什么样的感受跟种子玩的时候，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 172, "start": 1711.0, "end": null, "speaker": "S2", "text": "我跟张子文一起搭了一个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 173, "start": 1717.0, "end": null, "speaker": "T", "text": "跷跷板，你的心情", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 174, "start": 1719.0, "end": null, "speaker": "S2", "text": "是很开心，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 175, "start": 1720.0, "end": null, "speaker": "T", "text": "你们的心情呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 176, "start": 1722.0, "end": null, "speaker": "S1", "text": "怎么样？啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 177, "start": 1723.0, "end": null, "speaker": "S2", "text": "我的心情也很开心，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 178, "start": 1725.0, "end": null, "speaker": "T", "text": "看来快乐的时光总是很短暂的，啊我们等会儿可以继续玩。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 179, "start": 1732.0, "end": null, "speaker": "T", "text": "那你的这颗种子朋友，你接下来还想跟它做哪些有意思的事儿？呢在今后的每一天里你想跟种子做什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 180, "start": 1744.0, "end": null, "speaker": "S3", "text": "我和种子玩滑滑梯，那个种子滑得很快都掉地上了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 181, "start": 1750.0, "end": null, "speaker": "T", "text": "那你接下来的日子想干什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 182, "start": 1754.0, "end": null, "speaker": "S3", "text": "接下来的日子日子我不我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 183, "start": 1759.0, "end": null, "speaker": "S2", "text": "什么日子", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 184, "start": 1760.0, "end": null, "speaker": "T", "text": "噢没想好，就是接下来和种子可以做哪些有意思的事情，有没有人有想法？想一想。种子朋友我们可以带它去做些什么事，呢我们都可以去试一试。来，你说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 185, "start": 1776.0, "end": null, "speaker": "S2", "text": "我陪种子玩，我们是搭了一个滑梯，然后那个滑梯把那个圆形的那个东西滑下来，那个重的那个东西就要先先沉下去，然后再漂浮起来。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 186, "start": 1795.0, "end": null, "speaker": "T", "text": "我知道了你们沉浸在游戏里面，那我们继续去玩一玩，继续去有新的发现，好不好？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 187, "start": 1804.0, "end": null, "speaker": "S1", "text": "好。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 188, "start": 1805.0, "end": null, "speaker": "T", "text": "来，再去玩起来。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}], "chains": [{"start_id": 1, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 1}], "end_id": 1, "ir_pairs": 0, "has_feedback": false}, {"start_id": 2, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 2}, {"role": "R", "utt_id": 3}, {"role": "F-ext", "utt_id": 4}, {"role": "R", "utt_id": 5}, {"role": "F-ext", "utt_id": 6}, {"role": "R", "utt_id": 7}, {"role": "F-ext", "utt_id": 8}], "end_id": 8, "ir_pairs": 3, "has_feedback": true}, {"start_id": 9, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 9}, {"role": "R", "utt_id": 10}, {"role": "F-ext", "utt_id": 11}], "end_id": 11, "ir_pairs": 1, "has_feedback": true}, {"start_id": 13, "initiator": "C", "turns": [{"role": "I-C", "utt_id": 13}], "end_id": 13, "ir_pairs": 0, "has_feedback": false}, {"start_id": 14, "initiator": "T", " ows": [{"no": 1, "time": "00:00:10", "speaker": "老师", "text": "小伙伴们，最近啊我们一直在收集各种各样的，没错，来让我们一起再来看一看，吧收集了这么多的种子，今天我们就来和种子玩游戏怎么样？异口同声，啊那这么多的种子，如果让你选一颗最最最最喜欢的，你会选择哪一颗？呢嗯不着急，等会儿呀我们到后面的桌子上去选一棵最喜欢的用上工具看一看，比一比选一选把它找出来，然后把你最喜欢的那一颗种子放到我们前面的。唉真好听这个名字。种子展示台上怎么样？好，听懂了就行动吧去找一找。"}, {"no": 2, "time": "00:02:43", "speaker": "老师", "text": "噢你想选这棵是吗？"}, {"no": 3, "time": "00:02:53", "speaker": "学生1", "text": "我选那棵"}, {"no": 4, "time": "00:02:58", "speaker": "老师", "text": "嗯看看它长什么"}, {"no": 5, "time": "00:03:07", "speaker": "学生1", "text": "样子？"}, {"no": 6, "time": "00:03:09", "speaker": "老师", "text": "挺香的。噢一种感觉也在分享，这是新奇的发现，真。好，噢这个是什么？你的放大镜会看到什么内容，呢对我们的工具也可以用起来。"}, {"no": 7, "time": "00:03:40", "speaker": "学生1", "text": "没事，"}, {"no": 8, "time": "00:03:42", "speaker": "老师", "text": "没关系，我们可以先把叶子放在这，带着它，好不好？选好了，噢这是你的发现，等会可以分享给我们哦嗯两颗也再比一比，啊是的，很特别，啊选好了吗？选好了，我们就带着你心爱的种子把它放到我们的展示架上来。喽好的，可以都可以啊按照自己的观察来选择。"}, {"no": 9, "time": "00:04:44", "speaker": "老师", "text": "好速度快，大班的孩子就是不一样。啊哇塞，你们看看现在我们的展示架上是不是都是你们最喜欢的种子？啦是的，谁想第一个来介绍一下你喜欢它的理由？这么多小手，我请谁？来请你。来，你的种子是"}, {"no": 10, "time": "00:05:13", "speaker": "学生2", "text": "我的种子，是这个"}, {"no": 11, "time": "00:05:15", "speaker": "老师", "text": "哇来把它拿下来来，我们一起展示给小朋友看看，给好朋友看一看，这是他的选择。"}, {"no": 12, "time": "00:05:26", "speaker": "老师", "text": "他可宝贝可宝贝，喽好，唉呦抓紧时间来让他闪亮登台来说说你的介绍。"}, {"no": 13, "time": "00:05:43", "speaker": "学生2", "text": "因为他重重的因为他重重地"}, {"no": 14, "time": "00:05:50", "speaker": "老师", "text": "重重地你是怎么感受到他是，种种的呢"}, {"no": 15, "time": "00:05:54", "speaker": "学生2", "text": "我是用手用手"}, {"no": 16, "time": "00:05:56", "speaker": "老师", "text": "怎么样？"}, {"no": 17, "time": "00:05:58", "speaker": "学生2", "text": "我是用手拿着晃了晃，"}, {"no": 18, "time": "00:06:03", "speaker": "老师", "text": "看看，这就是你选择它的理由吗？噢因为用手能感受到它的重量，所以坚定的选择了它，真好，有没有跟它选择一样的小朋友？"}, {"no": 19, "time": "00:06:19", "speaker": "老师", "text": "谢谢你这颗种子有没有跟他选择一样的小朋友？好。来，请你来，男孩你选择的理由是什么？"}, {"no": 20, "time": "00:06:28", "speaker": "学生1", "text": "他"}, {"no": 21, "time": "00:06:30", "speaker": "学生3", "text": "比较软，"}, {"no": 22, "time": "00:06:32", "speaker": "学生1", "text": "噢你"}, {"no": 23, "time": "00:06:33", "speaker": "老师", "text": "是怎么感受到的？"}, {"no": 24, "time": "00:06:35", "speaker": "学生3", "text": "捏了。"}, {"no": 25, "time": "00:06:37", "speaker": "老师", "text": "还有想说的吗？"}, {"no": 26, "time": "00:06:39", "speaker": "学生3", "text": "嗯它像吃的，"}, {"no": 27, "time": "00:06:42", "speaker": "老师", "text": "看起来像吃的，而且用小手感受到了它的软度，是不是？谢谢你的分享，原来小手可真灵巧，来你来女孩你的种子是。来赶快展示给小朋友看看，走"}, {"no": 28, "time": "00:07:04", "speaker": "学生1", "text": "这么稀有，"}, {"no": 29, "time": "00:07:07", "speaker": "老师", "text": "啊没看到过，啊秀一下你的最爱的种子。"}, {"no": 30, "time": "00:07:12", "speaker": "老师", "text": "好，那我们来仔细听听噢他选择的理由是什么？来，我"}, {"no": 31, "time": "00:07:21", "speaker": "学生2", "text": "选择的理由是它像个花，而且香香的尖尖的开的很美丽，"}, {"no": 32, "time": "00:07:28", "speaker": "老师", "text": "噢这就是你的理由，看看原来眼睛看到了它像什么？鼻子闻到了它的味道，唉呦我们大班的小朋友观察的方法可真多。呀还有呢赶快来，我来看看啊请哪位小朋友我的小话筒要过来，喽请你说"}, {"no": 33, "time": "00:07:54", "speaker": "学生1", "text": "我"}, {"no": 34, "time": "00:07:56", "speaker": "学生3", "text": "的是这个种子"}, {"no": 35, "time": "00:07:58", "speaker": "老师", "text": "啊来。"}, {"no": 36, "time": "00:08:02", "speaker": "老师", "text": "选择的理由是"}, {"no": 37, "time": "00:08:03", "speaker": "学生3", "text": "选择的理由是它像个桃子，而且呢外面像巧克力粉，它看它的我摸的时候有有一点"}, {"no": 38, "time": "00:08:18", "speaker": "老师", "text": "粗糙看，眼睛看到了它独特的造型，这是他观察到的小手也派上用场了，这种感觉是"}, {"no": 39, "time": "00:08:27", "speaker": "学生1", "text": "很"}, {"no": 40, "time": "00:08:27", "speaker": "学生3", "text": "美妙的感觉，"}, {"no": 41, "time": "00:08:29", "speaker": "老师", "text": "唉呦我听你介绍也觉得美妙，送回去再来小米，速度快带上你的种子。"}, {"no": 42, "time": "00:08:40", "speaker": "老师", "text": "说说选择的理由"}, {"no": 43, "time": "00:08:43", "speaker": "学生3", "text": "就是"}, {"no": 44, "time": "00:08:44", "speaker": "学生2", "text": "嗯我"}, {"no": 45, "time": "00:08:46", "speaker": "学生3", "text": "我的理由是嗯它像我最爱吃的豌豆，而且是绿色"}, {"no": 46, "time": "00:08:55", "speaker": "老师", "text": "的眼睛看到的颜色，喜欢吃的食物也能够联想起来，真不错，谢谢你的分享。唉呀我再来请一位小朋友来，女孩大步走，有精神嗯登场，登登来。"}, {"no": 47, "time": "00:09:17", "speaker": "学生2", "text": "夜莺呢它光滑滑的，而且它是一个人你你你看到一个什么东西他他会他会在你里面都在里面弄出来的，"}, {"no": 48, "time": "00:09:36", "speaker": "老师", "text": "噢里面可能还有秘密是吧？噢他是用小手摸出来感受到了它光滑的触感。真好，有没有跟他选择一样的小伙伴来补充？来，蒋一涵来。嗯来来来，你有你你有什么想说的吗？"}, {"no": 49, "time": "00:09:56", "speaker": "学生2", "text": "我感觉它像宝石"}, {"no": 50, "time": "00:09:59", "speaker": "学生1", "text": "嗯"}, {"no": 51, "time": "00:09:59", "speaker": "老师", "text": "它"}, {"no": 52, "time": "00:09:59", "speaker": "学生2", "text": "光滑滑"}, {"no": 53, "time": "00:10:02", "speaker": "老师", "text": "的看看，用眼睛发现了它独有的外形造型有意思，啊来，陈涵。"}, {"no": 54, "time": "00:10:13", "speaker": "老师", "text": "好的，带着你的宝贝它可珍贵了，噢轻轻的听听它的介绍，噢"}, {"no": 55, "time": "00:10:22", "speaker": "学生2", "text": "因为我知道它们怎么生长出来的，"}, {"no": 56, "time": "00:10:28", "speaker": "学生1", "text": "噢"}, {"no": 57, "time": "00:10:30", "speaker": "老师", "text": "怎么生长出来都知道啊你是怎么知道的。"}, {"no": 58, "time": "00:10:34", "speaker": "学生2", "text": "呢我在我老家种过花生"}, {"no": 59, "time": "00:10:38", "speaker": "老师", "text": "的，看看生活中的观察，小能手唉经历过的都能够记在心里，那你给我们介绍一下。"}, {"no": 60, "time": "00:10:45", "speaker": "学生2", "text": "首先它在泥土里面会慢慢的发芽，发芽成很大了之后，会有一个小根子钻到泥土里面，后面花生就会慢慢的慢慢的长大长大了之后树叶变黄了，就能就能摘出来了，"}, {"no": 61, "time": "00:11:11", "speaker": "老师", "text": "此处要有掌声太厉害了，陈涵能够根据自己长时间的一个观察，"}, {"no": 62, "time": "00:11:23", "speaker": "学生3", "text": "唉"}, {"no": 63, "time": "00:11:24", "speaker": "老师", "text": "坚定的选择这颗种子。"}, {"no": 64, "time": "00:11:26", "speaker": "老师", "text": "大班的孩子就是不一样，确实有的时候观察不是一会会是需要一直坚持的。"}, {"no": 65, "time": "00:11:36", "speaker": "老师", "text": "再来一位女孩速度快，说说你的理由，我"}, {"no": 66, "time": "00:11:50", "speaker": "学生2", "text": "的种子像花生那个皮厚厚的，啊它外面还有很多的壳，现在把那个壳啊掰开了，成了这样的小种子，"}, {"no": 67, "time": "00:12:08", "speaker": "老师", "text": "噢谢谢你的分享非常的清楚，来吧，最后再请一位晨晨来介绍一下你的种子特别在哪里，"}, {"no": 68, "time": "00:12:21", "speaker": "学生3", "text": "我这个有点像树叶，然后下面有条纹，"}, {"no": 69, "time": "00:12:28", "speaker": "老师", "text": "嗯花纹也能通过眼睛看得清清楚楚的，谢谢你的分享。"}, {"no": 70, "  "00:24:29", "speaker": "老师", "text": "嗯好的，你的种子是"}, {"no": 139, "time": "00:24:31", "speaker": "学生2", "text": "我的种子是尖尖的，我陪陈涵和大牛牛一起玩，陈涵的可以划，我的划不下来，大牛牛的也划不"}, {"no": 140, "time": "00:24:45", "speaker": "老师", "text": "下来，看看，不仅自己玩，还和朋友的种子一起对比了一下，噢那为什么会有这样的情况呢？"}, {"no": 141, "time": "00:24:53", "speaker": "学生2", "text": "因为我们俩的摩擦力"}, {"no": 142, "time": "00:24:56", "speaker": "老师", "text": "噢摩擦力怎么样？"}, {"no": 143, "time": "00:24:59", "speaker": "学生2", "text": "不好，不光滑，"}, {"no": 144, "time": "00:25:01", "speaker": "老师", "text": "这跟种子的什么特点有有关系？"}, {"no": 145, "time": "00:25:04", "speaker": "学生2", "text": "啊因为它本身没水，而且还尖尖的，那"}, {"no": 146, "time": "00:25:09", "speaker": "老师", "text": "你觉得水的作用是什么？"}, {"no": 147, "time": "00:25:11", "speaker": "学生2", "text": "水的作用可以让它更光滑滑的更"}, {"no": 148, "time": "00:25:16", "speaker": "老师", "text": "快，还有想说的吗？来，跟他一起玩的小朋友有没有补充的？陈涵。"}, {"no": 149, "time": "00:25:25", "speaker": "老师", "text": "牛牛也到前面来，你有什么想补充的说？"}, {"no": 150, "time": "00:25:28", "speaker": "学生1", "text": "我先帮女生吧"}, {"no": 151, "time": "00:25:29", "speaker": "老师", "text": "噢哟女士优先啊点赞，来说你们玩的时候"}, {"no": 152, "time": "00:25:34", "speaker": "学生2", "text": "我们玩的时候她们也拿了种子划，没有我划的第一个种子划得快，它们两个的种子可以在水里跟我一样漂浮起来，"}, {"no": 153, "time": "00:25:51", "speaker": "学生1", "text": "还"}, {"no": 154, "time": "00:25:52", "speaker": "老师", "text": "玩了水里的游戏能够浮起来，这个好像是一个新的发现新的现象，啊你来补充。"}, {"no": 155, "time": "00:26:02", "speaker": "学生2", "text": "我跟陈涵和叶美琪我的是用手推，然后叶美琪的滑不上去，然后陈涵的滑的下去，"}, {"no": 156, "time": "00:26:14", "speaker": "老师", "text": "看看同一种种子也好，不同的种子也好，不一样的玩法就会有不一样的发现。刚刚有的小朋友说我的种子滑落的时候，速度有快也有也有慢，这是你用眼睛去发现，用小手去配合的。还有的小朋友说唉放在水里好像会怎么样？"}, {"no": 157, "time": "00:26:43", "speaker": "学生2", "text": "神奇。"}, {"no": 158, "time": "00:26:44", "speaker": "老师", "text": "噢有发现浮起来的，还有没有发现？嘴巴说出来有些会浮起来，而有一些可能会沉，对沉下去真是不一样的发现。"}, {"no": 159, "time": "00:27:07", "speaker": "老师", "text": "听到小伙伴的想法了吗？可能跟他的轻重有关系，那你怎么能发现他的轻重呢？"}, {"no": 160, "time": "00:27:15", "speaker": "学生2", "text": "因为我我发现陈涵的浮起来了，大妞妞的就沉下去了，"}, {"no": 161, "time": "00:27:22", "speaker": "老师", "text": "噢这两颗种子你有没有比过谁重谁轻，啊"}, {"no": 162, "time": "00:27:26", "speaker": "学生2", "text": "我倒是摸过大牛牛的，"}, {"no": 163, "time": "00:27:30", "speaker": "老师", "text": "噢用摸的方式来猜测和"}, {"no": 164, "time": "00:27:33", "speaker": "学生2", "text": "推理，我知道我和大牛牛的谁重，"}, {"no": 165, "time": "00:27:37", "speaker": "老师", "text": "嗯什么方法，"}, {"no": 166, "time": "00:27:38", "speaker": "学生1", "text": "我"}, {"no": 167, "time": "00:27:38", "speaker": "学生2", "text": "用手两个都拿起来了，果是大妞妞的比较重一点，"}, {"no": 168, "time": "00:27:47", "speaker": "老师", "text": "小手还能帮我们掂一掂，感受独特的重量。"}, {"no": 169, "time": "00:27:53", "speaker": "老师", "text": "还有的小朋友刚刚在分享的时候也说了，唉有的种子啊它还会飞起来，而且滚落的状态也都是不一样的。孩子们你们一定还有很多的发现，我们等会继续聊好不好？"}, {"no": 170, "time": "00:28:14", "speaker": "学生1", "text": "好。"}, {"no": 171, "time": "00:28:16", "speaker": "老师", "text": "唉呀聊了这么多，玩了那么多的游戏和种子玩游戏的时候，你有什么样的感受？呢等会再来分享，不着急有什么样的感受跟种子玩的时候，"}, {"no": 172, "time": "00:28:31", "speaker": "学生2", "text": "我跟张子文一起搭了一个"}, {"no": 173, "time": "00:28:37", "speaker": "老师", "text": "跷跷板，你的心情"}, {"no": 174, "time": "00:28:39", "speaker": "学生2", "text": "是很开心，"}, {"no": 175, "time": "00:28:40", "speaker": "老师", "text": "你们的心情呢"}, {"no": 176, "time": "00:28:42", "speaker": "学生1", "text": "怎么样？啊"}, {"no": 177, "time": "00:28:43", "speaker": "学生2", "text": "我的心情也很开心，"}, {"no": 178, "time": "00:28:45", "speaker": "老师", "text": "看来快乐的时光总是很短暂的，啊我们等会儿可以继续玩。"}, {"no": 179, "time": "00:28:52", "speaker": "老师", "text": "那你的这颗种子朋友，你接下来还想跟它做哪些有意思的事儿？呢在今后的每一天里你想跟种子做什么？"}, {"no": 180, "time": "00:29:04", "speaker": "学生3", "text": "我和种子玩滑滑梯，那个种子滑得很快都掉地上了，"}, {"no": 181, "time": "00:29:10", "speaker": "老师", "text": "那你接下来的日子想干什么？"}, {"no": 182, "time": "00:29:14", "speaker": "学生3", "text": "接下来的日子日子我不我"}, {"no": 183, "time": "00:29:19", "speaker": "学生2", "text": "什么日子"}, {"no": 184, "time": "00:29:20", "speaker": "老师", "text": "噢没想好，就是接下来和种子可以做哪些有意思的事情，有没有人有想法？想一想。种子朋友我们可以带它去做些什么事，呢我们都可以去试一试。来，你说。"}, {"no": 185, "time": "00:29:36", <script>
// ===== demo_app.js =====
// ===================================================================
// AI幼教课堂分析系统 —— 演示页逻辑
//
// 目标工程迁移说明：本文件用 Vue 3 Options API 写（未用 <script setup>），
// 是因为要在单个 .js 文件里塞进 Vue 全局构建能识别的组件写法。
// 迁进 Vite 工程时，每个 Vue.component(...) 对应一个 .vue 单文件组件，
// data() 里的计算逻辑对应 <script setup lang="ts"> 里的 computed()。
// ===================================================================

const { createApp, computed, ref } = Vue;

// ---------- 工具函数 ----------

function fmtPct(x, digits) {
  if (x === null || x === undefined) return '数据不足';
  return (x * 100).toFixed(digits || 0) + '%';
}

function fmtTime(sec) {
  if (sec === null || sec === undefined) return '—';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function roleLabel(speaker) {
  if (speaker === 'T') return '教师';
  if (speaker === 'S') return '集体/未区分';
  const m = /^S(\d+)$/.exec(speaker || '');
  return m ? `幼儿${m[1]}` : (speaker || '未知');
}

const IRF_ROLE_LABEL = {
  'I-T': '教师发起', 'I-C': '幼儿发起', 'R': '应答',
  'F-eval': '反馈(简单评价)', 'F-ext': '反馈(拓展型)',
};

// ---------- ECharts 封装：一个通用的图表容器组件 ----------
// 目标工程建议换成 vue-echarts 的 <v-chart :option="..." />，
// 这里手写是因为要避免再引入一个 CDN 依赖。

const EChart = {
  props: { option: { type: Object, required: true }, height: { type: String, default: '300px' } },
  template: `<div :style="{width:'100%', height: height}" ref="el"></div>`,
  // 图表实例不能放进 data()：Vue 会把它包成响应式代理，ECharts 内部再用代理对象调用自己的方法时，
  // 会读到 undefined 的 series 类型并在 resize 时抛 "Cannot read properties of undefined (reading 'type')"，
  // 之后图表就停在一个很小的宽度上，窗口怎么拉都不再铺满。
  // 用 markRaw 包住（或干脆存成非响应式字段）让 Vue 不去代理它。
  mounted() {
    const chart = echarts.init(this.$refs.el);
    this._chart = Vue.markRaw(chart);
    this._chart.setOption(Vue.toRaw(this.option));
    // 容器自身尺寸变化（窗口拉伸、侧栏收起、标签页切换后才显示出来）都要重画，
    // 只监听 window.resize 抓不到后两种。ResizeObserver 不可用时退回 window.resize。
    const doResize = () => { if (this._chart && !this._chart.isDisposed()) this._chart.resize(); };
    if (typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver(doResize);
      this._ro.observe(this.$refs.el);
    } else {
      this._resize = doResize;
      window.addEventListener('resize', this._resize);
    }
  },
  watch: {
    option: {
      deep: true,
      handler(v) {
        if (this._chart && !this._chart.isDisposed()) this._chart.setOption(Vue.toRaw(v), true);
      },
    },
  },
  beforeUnmount() {
    if (this._ro) this._ro.disconnect();
    if (this._resize) window.removeEventListener('resize', this._resize);
    if (this._chart && !this._chart.isDisposed()) this._chart.dispose();
    this._chart = null;
  },
};

const AnalysisModule = {
  props: { data: { type: Object, required: true } },

  data() {
    return {
      dim: 'overview',
      // 逐字稿筛选
      filterSpeaker: null,
      filterIrf: null,
      keyword: '',
      onlyLowConf: false,
    };
  },

  computed: {
    dateText() { return this.data && this.data.teachingDate ? formatTeachingDate(this.data.teachingDate) : ''; },
    m() { return this.data.metrics; },
    kw() { return this.m.keywords; },
    irf() { return this.m.irf; },
    bloom() { return this.m.bloom; },
    tf() { return this.m.teacher_function; },
    part() { return this.m.participation; },
    quality() { return this.m.interaction_quality; },

    // 转写缺陷标记：由 build_demo.py 用 detect_data_flags 从实际数据探测后注入。
    // 页面上所有"受无标点影响/未做说话人分离"的提示都以它为准，不再写死。
    flags() { return this.data.dataFlags || {}; },
    // 核心词表的说明文字来自各活动自己的词表，不在页面上写死某个活动的名字
    lexiconNote() { return this.data.lexiconNote || '词表说明缺失，请以词表文件为准。'; },
    noPunct() { return !!this.flags.no_punctuation; },
    noDiar() { return !!this.flags.no_diarization; },
    // 话轮是否有终点。课堂原文只有起点，此时"话轮时长/教师话语时长"类统计都画不出来、也不能估。
    hasEndTimes() { return this.data.utterances.some(u => u.end !== null && u.end !== undefined); },

    // ---- 指标总览卡片。suspect=true 的指标受"无标点"影响，页面上标红 ----
    overviewCards() {
      const p = this.part, wt = p.wait_time || {};
      return [
        { label: '核心词覆盖率', value: fmtPct(this.kw.core_coverage),
          hint: `核心词表 ${this.kw.core_word_total} 个，命中 ${this.kw.core_words_mentioned.length} 个` },
        { label: '幼儿核心词复用率', value: fmtPct(this.kw.child_reuse_rate),
          hint: '教师先说出、后被幼儿主动使用的核心词占比' },
        { label: '话轮链总数', value: this.irf.total_chains,
          hint: `平均链长 ${this.irf.avg_chain_length.toFixed(2)} 轮` },
        { label: 'IRF完整率', value: fmtPct(this.irf.irf_complete_rate),
          hint: '教师给出反馈的话轮链占比' },
        { label: '幼儿主动发起占比', value: fmtPct(this.irf.child_initiated_rate),
          hint: '反映幼儿在对话中的主动性' },
        { label: '反馈拓展率', value: fmtPct(this.irf.feedback_extend_rate),
          suspect: this.noPunct,
          hint: this.noPunct ? '受无标点影响：字数兜底规则把长话轮几乎全判成拓展型' : '' },
        { label: '高阶提问占比', value: fmtPct(this.bloom.high_order_question_rate),
          hint: '分析+评价+创造三层之和' },
        { label: '开放式提问占比', value: fmtPct(this.tf.open_question_rate),
          suspect: this.noPunct,
          hint: this.noPunct ? '受无标点影响：问句判定过度触发，分母被污染' : '' },
        { label: '具体肯定占比', value: fmtPct(this.tf.specific_feedback_rate),
          suspect: this.noPunct,
          hint: this.noPunct ? '受无标点影响：短反馈被并入长句而消失' : '' },
        { label: '幼儿话轮总数', value: p.child_turn_total,
          hint: `个体应答 ${p.individual_response_count} 次` },
        { label: '集体齐答次数',
          value: p.group_response_count === null ? '数据不支持' : p.group_response_count,
          na: p.group_response_count === null,
          hint: p.group_response_count === null
            ? '未做说话人分离，无法区分齐答与"认不出是谁"'
            : '原文没有集体齐答标记，全部按个体应答计，此值不代表课堂上没有齐答' },
        { label: '教师等待时间中位数',
          value: wt.median_sec !== undefined ? wt.median_sec.toFixed(1) + ' 秒' : '数据不支持',
          na: wt.median_sec === undefined,
          hint: wt.over_3sec_rate !== undefined
            ? `达到3秒以上的比例 ${fmtPct(wt.over_3sec_rate)}（共 ${wt.count} 次可测量提问）`
            : '转写只有话轮起点、没有终点，算不出提问结束到应答开始的间隔' },
      ];
    },

    // ---- 关键词：教师 vs 幼儿高频词对比 ----
    wordChartOption() {
      const t = this.kw.teacher_top_words.slice(0, 12);
      const c = this.kw.child_top_words.slice(0, 12);
      return {
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        legend: { data: ['教师', '幼儿'], top: 0 },
        grid: { left: 70, right: 24, top: 36, bottom: 24 },
        xAxis: { type: 'value', name: '出现次数' },
        yAxis: [
          { type: 'category', inverse: true,
            data: t.map(x => x[0]), axisLabel: { fontSize: 11 } },
        ],
        series: [
          { name: '教师', type: 'bar', data: t.map(x => x[1]),
            itemStyle: { color: '#1677ff' }, barMaxWidth: 16 },
          { name: '幼儿', type: 'bar',
            data: t.map(w => { const hit = c.find(x => x[0] === w[0]); return hit ? hit[1] : 0; }),
            itemStyle: { color: '#13c2c2' }, barMaxWidth: 16 },
        ],
      };
    },

    // ---- 布鲁姆：提问 vs 应答层次分布 ----
    bloomChartOption() {
      const q = this.bloom.question_level_distribution || {};
      const r = this.bloom.response_level_distribution || {};
      const levels = Object.keys(q).length ? Object.keys(q) : Object.keys(r);
      const short = levels.map(l => l.split(' ')[0]);
      return {
        tooltip: { trigger: 'axis',
          valueFormatter: v => (v * 100).toFixed(0) + '%' },
        legend: { data: ['教师提问', '幼儿应答'], top: 0 },
        grid: { left: 50, right: 24, top: 36, bottom: 30 },
        xAxis: { type: 'category', data: short },
        yAxis: { type: 'value', axisLabel: { formatter: v => (v * 100).toFixed(0) + '%' } },
        series: [
          { name: '教师提问', type: 'bar', data: levels.map(l => q[l] || 0),
            itemStyle: { color: '#1677ff' }, barMaxWidth: 34 },
          { name: '幼儿应答', type: 'bar', data: levels.map(l => r[l] || 0),
            itemStyle: { color: '#95de64' }, barMaxWidth: 34 },
        ],
      };
    },

    // ---- 教师话语功能分布 ----
    tfChartOption() {
      const dist = this.tf.tag_distribution || {};
      const rows = Object.keys(dist).map(k => ({ name: k, value: +(dist[k] * 100).toFixed(1) }))
        .sort((a, b) => b.value - a.value);
      return {
        tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
        legend: { orient: 'vertical', right: 0, top: 'center', itemWidth: 10, itemHeight: 10,
          textStyle: { fontSize: 11 } },
        series: [{
          type: 'pie', radius: ['42%', '68%'], center: ['38%', '52%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: '#fff', borderWidth: 2 },
          label: { formatter: '{c}%', fontSize: 11 },
          data: rows,
        }],
      };
    },

    // ---- 话轮时间轴：教师/幼儿发言在32分钟里的分布 ----
    timelineChartOption() {
      const utts = this.data.utterances;
      const tPoints = [], sPoints = [];
      utts.forEach(u => {
        if (u.start === null || u.start === undefined) return;
        // 有终点：纵轴为话轮时长（秒）。无终点：不估算时长，纵轴改用字数。
        const hasEnd = u.end !== null && u.end !== undefined;
        const y = hasEnd ? (u.end - u.start) : u.text.length;
        const pt = [u.start / 60, y, u.text.length];
        (u.speaker === 'T' ? tPoints : sPoints).push(pt);
      });
      return {
        tooltip: {
          formatter: p => `${p.seriesName}<br/>时间 ${fmtTime(p.value[0] * 60)}` +
                          (this.hasEndTimes ? `<br/>时长 ${p.value[1].toFixed(1)}秒` : '') +
                          `<br/>字数 ${p.value[2]}`,
        },
        legend: { data: ['教师', '幼儿'], top: 0 },
        grid: { left: 52, right: 24, top: 36, bottom: 40 },
        xAxis: { type: 'value', name: '分钟', min: 0,
          max: Math.ceil((this.data.meta.duration_sec || 1915) / 60) },
        yAxis: { type: 'value', name: this.hasEndTimes ? '话轮时长(秒)' : '话轮字数' },
        series: [
          { name: '教师', type: 'scatter', data: tPoints, symbolSize: 5,
            itemStyle: { color: 'rgba(22,119,255,.55)' } },
          { name: '幼儿', type: 'scatter', data: sPoints, symbolSize: 5,
            itemStyle: { color: 'rgba(19,194,194,.7)' } },
        ],
      };
    },

    // ---- CLASS 三领域 ----
    qualityDomains() {
      const tierColor = { '较强': 'green', '中等': 'blue', '待改进': 'orange' };
      return (this.quality.domains || []).map(d => ({
        ...d, color: tierColor[d.tier] || 'default',
      }));
    },

    // ---- 逐字稿（含筛选）----
    utteranceRows() {
      const kwText = this.keyword.trim();
      return this.data.utterances.filter(u => {
        if (this.filterSpeaker && u.speaker !== this.filterSpeaker) return false;
        if (this.filterIrf && u.irf_role !== this.filterIrf) return false;
        if (kwText && u.text.indexOf(kwText) < 0) return false;
        return true;
      }).map(u => ({
        key: u.id, id: u.id,
        time: fmtTime(u.start),
        role: roleLabel(u.speaker),
        speaker: u.speaker,
        text: u.text,
        irf: IRF_ROLE_LABEL[u.irf_role] || '—',
      }));
    },

    utteranceColumns() {
      return [
        { title: '#', dataIndex: 'id', width: 60 },
        { title: '时间点', dataIndex: 'time', width: 84 },
        { title: '角色', dataIndex: 'role', width: 108, key: 'role' },
        { title: '说话内容', dataIndex: 'text' },
        { title: 'IRF', dataIndex: 'irf', width: 130 },
      ];
    },

    uncertainPairs() {
      const byId = {};
      this.data.utterances.forEach(u => { byId[u.id] = u; });
      return (this.bloom.uncertain_pairs || []).map(p => ({
        qId: p[0], qLevel: p[1], rId: p[2], rLevel: p[3],
        qText: (byId[p[0]] || {}).text || '',
        rText: (byId[p[2]] || {}).text || '',
      }));
    },

    suggestions() {
      // 与 report.py _auto_suggestions 的阈值一致
      const out = [];
      if ((this.bloom.high_order_question_rate || 0) < 0.2)
        out.push('高阶提问（分析/评价/创造）占比不足20%，可在活动展开或延伸阶段增加“你觉得…为什么”“接下来会怎样”类提问。');
      if ((this.tf.specific_feedback_rate || 0) < 0.3)
        out.push('具体性反馈占比不高，多为笼统表扬。可在反馈中点出幼儿回答的具体内容，帮助其他幼儿也听懂好在哪里。');
      if ((this.irf.child_initiated_rate || 0) < 0.1)
        out.push('幼儿主动发起话轮比例较低。可在环节中预留“幼儿提问”或“幼儿评论”的开放时间。');
      const wt = this.part.wait_time;
      if (wt && wt.over_3sec_rate < 0.3)
        out.push('多数提问后的等待时间不足3秒。适当延长等待时间通常能让幼儿的应答更完整，但需结合录像判断——若教师提问后立即点名，间隔短并不等于没给思考时间。');
      return out;
    },
  },

// ===== demo_assessment.js =====
// ===================================================================
// 模块二：活动评估（依据《益玩趣学——集体教学活动评估表》）
// 目标工程对应 src/views/AssessmentView.vue
//
// 核心设计：不打分。评估表本身没有任何评分档位/分值/权重，
// 唯一的填写列是「所见所思」——它是质性观察工具。
// 页面输出的是"每条指标机器有什么证据、哪些必须人工看"。
// ===================================================================

const KIND_COLOR = {
  EVIDENCE: 'green',
  PARTIAL: 'blue',
  VISUAL: 'orange',
  PLAN: 'purple',
};

const AssessmentModule = {
  props: { data: { type: Object, required: true } },

  data() {
    return {
      kindFilter: [],      // 多选：只看某几类证据等级
      search: '',
      activeSection: 'all',
    };
  },

  computed: {
    dateText() { return this.data && this.data.teachingDate ? formatTeachingDate(this.data.teachingDate) : ''; },
    a() { return this.data.assessment; },

    // ---- 证据覆盖环形图 ----
    coverageChartOption() {
      const rows = this.a.coverage.map(c => ({
        name: c.label, value: c.count,
        itemStyle: { color: ({
          EVIDENCE: '#52c41a', PARTIAL: '#1677ff',
          VISUAL: '#fa8c16', PLAN: '#722ed1',
        })[c.kind] },
      }));
      return {
        tooltip: { trigger: 'item', formatter: '{b}: {c} 条 ({d}%)' },
        legend: { bottom: 0, itemWidth: 10, itemHeight: 10, textStyle: { fontSize: 11 } },
        series: [{
          type: 'pie', radius: ['45%', '70%'], center: ['50%', '44%'],
          itemStyle: { borderColor: '#fff', borderWidth: 2 },
          label: { formatter: '{c}条\n{d}%', fontSize: 11, lineHeight: 15 },
          data: rows,
        }],
      };
    },

    // ---- 各维度的证据构成堆叠条形图 ----
    dimStackOption() {
      const dims = [];
      this.a.sections.forEach(s => {
        s.dimensions.forEach(d => {
          const counts = { EVIDENCE: 0, PARTIAL: 0, VISUAL: 0, PLAN: 0 };
          d.groups.forEach(g => g.items.forEach(i => { counts[i.kind] = (counts[i.kind] || 0) + 1; }));
          // 维度名太长，截短用于坐标轴
          const short = d.name.replace(/^维度[一二三四五]：/, '').split('·')[0];
          dims.push({ name: short, counts });
        });
      });
      const series = [
        ['有量化证据', 'EVIDENCE', '#52c41a'],
        ['部分线索', 'PARTIAL', '#1677ff'],
        ['需看画面', 'VISUAL', '#fa8c16'],
        ['需看教案', 'PLAN', '#722ed1'],
      ].map(([name, key, color]) => ({
        name, type: 'bar', stack: 'total',
        emphasis: { focus: 'series' },
        itemStyle: { color },
        label: { show: true, formatter: p => p.value > 0 ? p.value : '', fontSize: 10 },
        data: dims.map(d => d.counts[key] || 0),
      }));
      return {
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        legend: { top: 0, itemWidth: 10, itemHeight: 10, textStyle: { fontSize: 11 } },
        grid: { left: 90, right: 20, top: 34, bottom: 24 },
        xAxis: { type: 'value', name: '指标数' },
        yAxis: { type: 'category', data: dims.map(d => d.name), axisLabel: { fontSize: 11 } },
        series,
      };
    },

    // ---- 按筛选条件过滤后的分节数据 ----
    filteredSections() {
      const kinds = this.kindFilter;
      const q = this.search.trim();
      return this.a.sections.map(s => ({
        ...s,
        dimensions: s.dimensions.map(d => ({
          ...d,
          groups: d.groups.map(g => ({
            ...g,
            items: g.items.filter(i => {
              if (kinds.length && kinds.indexOf(i.kind) < 0) return false;
              if (q && i.text.indexOf(q) < 0 && (i.name || '').indexOf(q) < 0) return false;
              return true;
            }),
          })).filter(g => g.items.length),
        })).filter(d => d.groups.length),
      })).filter(s => s.dimensions.length);
    },

    visibleCount() {
      let n = 0;
      this.filteredSections.forEach(s => s.dimensions.forEach(
        d => d.groups.forEach(g => { n += g.items.length; })));
      return n;
    },

    // ---- 只有"有量化证据"的指标，单独列出来供快速查看 ----
    evidenceItems() {
      const out = [];
      this.a.sections.forEach(s => s.dimensions.forEach(d => d.groups.forEach(g => {
        g.items.forEach(i => {
          if (i.kind === 'EVIDENCE') out.push({ ...i, dim: d.name, group: g.label });
        });
      })));
      return out;
    },
  },

// ===== demo_export_logic.js =====
// ===================================================================
// 导出：把各页面的内容整理成"文档模型"，再渲染成 Word(.docx) 或 CSV
// 纯逻辑部分（不依赖 Vue / DOM / docx 库），可在 Node 里测试
// （见 tests/test_export.mjs）。
//
// 分层：
//   各页面的 buildXxxDoc(...)  ->  文档模型 doc
//   toCsv(table)               ->  CSV 文本
//   Word 渲染在 demo_export_ui.js（要用浏览器里的 docx 库）
//
// 文档模型：
//   doc = { title, subtitle, notes:[string], sections:[ { heading, paragraphs:[string],
//           bullets:[string], tables:[ { caption, header:[string], rows:[[string]] } ] } ],
//           footer }
//   所有单元格都是已经格式化好的字符串（"数据不足""—"等占位在这里就定下来），
//   渲染层不再做任何数值处理——避免"页面显示数据不足、导出却变成 0 或空白"。
//
// 导出约束（与页面一致）：
//   - null/undefined 一律写成明确文字（数据不足/数据不支持/—），绝不写成 0 或空
//   - 没有总分、没有排名（人工评估汇总与页面一致）
//   - 带"不可采信"警示的指标，导出里同样带警示
// ===================================================================

// ---------------------------------------------------------------
// 通用
// ---------------------------------------------------------------

/** CSV 单元格转义：含逗号/引号/换行时加双引号并转义引号。 */
function csvCell(v) {
  let s = v === null || v === undefined ? '' : String(v);
  // 防 CSV 注入：以 = + - @ 开头的单元格，Excel 会当公式执行。
  // 加一个单引号前缀让它按文本处理。数字（含负数、百分号）不受影响——
  // 只对"以这些符号开头且后面不是纯数字"的文本处理。
  if (/^[=+\-@\t\r]/.test(s) && !/^[+-]?\d+(\.\d+)?%?$/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/** 二维表 -> CSV 文本（\r\n 换行；是否加 BOM 由下载层决定）。 */
function toCsv(header, rows) {
  const lines = [header.map(csvCell).join(',')];
  rows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
  return lines.join('\r\n');
}

/**
 * 文件名清理：先用 stripInvisible 去掉控制/不可见字符（与评估人姓名、活动名同一套规则，
 * 不在这里再写一份——不可见字符直接写进正则，已经出过三次语法错误），
 * 再把 Windows 文件名禁用的  / : * ? " < > | 换成下划线，限制 80 个字符。
 */
function safeFileName(name) {
  const cleaned = stripInvisible(name === null || name === undefined ? '' : name)
    // 字符类里 \\ 是反斜杠本身，\/ 是斜杠；两个都要列出，漏掉反斜杠会让 Windows 把它当路径分隔符
    .replace(/[\\\/:*?"<>|]/g, '_');
  return Array.from(cleaned).slice(0, 80).join('') || '导出';
}

/** yyyymmdd-hhmm，用于文件名，避免同名覆盖。时间由调用方传入便于测试。 */
function stamp(d) {
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

const _PCT = function (x) { return x === null || x === undefined ? '数据不足' : (x * 100).toFixed(0) + '%'; };

function emptyDoc(title, subtitle) {
  return { title: title, subtitle: subtitle || '', notes: [], sections: [], footer: '' };
}

function section(heading) {
  return { heading: heading, paragraphs: [], bullets: [], tables: [] };
}

/** 页脚：导出时间 + 来源，统一一句，避免各页各写一版。 */
function footerText(activityName, when) {
  return '导出自《AI幼教课堂分析系统》· ' + activityName + ' · 导出时间 ' +
    when.getFullYear() + '-' + String(when.getMonth() + 1).padStart(2, '0') + '-' + String(when.getDate()).padStart(2, '0') +
    ' ' + String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
}

// ---------------------------------------------------------------
// 课堂逐字稿
// ---------------------------------------------------------------

/**
 * rows : 要导出的话轮（调用方决定是全部还是当前筛选结果）
 * total: 逐字稿总话轮数
 * filterNote: 当前筛选条件的说明（无筛选传 ''）
 */
function buildVerbatimDoc(verbatim, rows, filterNote, activityName, when) {
  const doc = emptyDoc(verbatim.title || '课堂逐字稿', activityName);
  const total = verbatim.rows.length;
  doc.notes.push('内容为课堂原文原样导出，未做校订或改写。');
  if (rows.length !== total) {
    doc.notes.push('本文件只包含筛选后的 ' + rows.length + ' / ' + total + ' 条话轮' +
      (filterNote ? '（筛选条件：' + filterNote + '）' : '') + '，不是完整逐字稿。');
  }
  const s = section('逐字稿（共 ' + rows.length + ' 条）');
  s.tables.push({
    caption: '',
    header: ['序号', '时间', '说话人', '内容'],
    rows: rows.map(function (r) { return [String(r.no), r.time, r.speaker, r.text]; }),
  });
  doc.sections.push(s);
  doc.footer = footerText(activityName, when);
  doc.csv = { header: ['序号', '时间', '说话人', '内容'], rows: s.tables[0].rows };
  return doc;
}

if (typeof module !== 'undefined' && module.exports && typeof stripInvisible === 'undefined') {
  global.stripInvisible = require('./demo_manual_logic.js').stripInvisible;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { csvCell, toCsv, safeFileName, stamp, emptyDoc, section, footerText, buildVerbatimDoc, _PCT };
}

const _IRF_LABEL = { 'I-T': '教师发起', 'I-C': '幼儿发起', 'R': '应答', 'F-eval': '反馈(简单评价)', 'F-ext': '反馈(拓展型)' };

function _role(sp) {
  if (sp === 'T') return '教师';
  if (sp === 'S') return '集体/未区分';
  const m = /^S(\d+)$/.exec(sp || '');
  return m ? '幼儿' + m[1] : (sp || '未知');
}

function _time(sec) {
  if (sec === null || sec === undefined) return '—';
  sec = Math.round(sec);
  const p = function (n) { return String(n).padStart(2, '0'); };
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), r = sec % 60;
  return h > 0 ? h + ':' + p(m) + ':' + p(r) : p(m) + ':' + p(r);
}

const _KIND = { EVIDENCE: '有量化证据', PARTIAL: '部分线索', VISUAL: '需看画面', PLAN: '需看教案' };

    ['IRF完整率', _PCT(irf.irf_complete_rate)], ['幼儿主动发起占比', _PCT(irf.child_initiated_rate)],
    ['反馈拓展率', _PCT(irf.feedback_extend_rate) + suspect],
    ['简单评价型反馈', irf.feedback_eval_count + ' 次'], ['拓展型反馈', irf.feedback_extend_count + ' 次'],
  ] });
  doc.sections.push(i);

  const b = section('维度三：布鲁姆认知层次');
  const dist = function (d) {
    return d ? Object.keys(d).map(function (key) { return [key, _PCT(d[key])]; }) : [['（无数据）', '数据不足']];
  };
  b.tables.push({ caption: '教师提问的认知层次（共 ' + bloom.question_total + ' 个可定层次的提问）', header: ['层次', '占比'], rows: dist(bloom.question_level_distribution) });
  b.tables.push({ caption: '幼儿应答的认知层次（共 ' + bloom.response_total + ' 条）', header: ['层次', '占比'], rows: dist(bloom.response_level_distribution) });
  b.paragraphs.push('应答层次判定中低置信度的占比：' + _PCT(bloom.response_low_confidence_rate) + '。该占比高时，应答层次分布仅供定位片段，不宜当作结论。');
  doc.sections.push(b);

  const t = section('维度四：教师话语功能');
  t.tables.push({ caption: '', header: ['指标', '数值'], rows: [
    ['教师话轮总数', String(tf.total_teacher_turns)],
    ['开放式提问占比', _PCT(tf.open_question_rate) + suspect],
    ['具体肯定占比', _PCT(tf.specific_feedback_rate) + suspect],
    ['组织管理话语占比', _PCT(tf.organize_rate)],
    ['支架引导出现次数', String(tf.scaffold_count)],
    ['情感支持出现次数', String(tf.emotional_count)],
  ] });
  doc.sections.push(t);

  const q = section('维度五：师幼互动质量');
  q.paragraphs.push('各领域给出的是定性档位与依据，不是量表分数；真正的评分需要受训观察员对照行为锚点打分。');
  const domains = (m.interaction_quality || {}).domains || [];
  if (domains.length) {
    q.tables.push({ caption: '', header: ['领域', '档位', '依据'],
      rows: domains.map(function (d) { return [d.name || d.domain || '', d.tier || '—', d.evidence || d.basis || d.note || '']; }) });
  } else {
    q.paragraphs.push('数据不足。');
  }
  doc.sections.push(q);

  const pa = section('维度六：参与度');
  const sc = part.speaking_counts_by_child;
  pa.tables.push({ caption: '', header: ['指标', '数值'], rows: [
    ['幼儿话轮总数', String(part.child_turn_total)],
    ['个体应答次数', String(part.individual_response_count)],
    ['发言幼儿标签数', part.identified_children_count ? String(part.identified_children_count) : '数据不支持'],
