<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI幼教课堂分析系统</title>

<!--
  技术栈说明
  ================================================================
  目标工程：Vue 3 + TypeScript + Vite + Ant Design Vue
  本文件：设计确认用的单文件演示页

  为什么不是真的 Vite 工程：单个 HTML 无法运行 Vite 构建与 TS 编译。
  这里用 Vue 3 global build + Ant Design Vue UMD 通过 CDN 加载，
  组件结构、状态管理方式、Ant Design 组件选型都与目标工程 1:1 对应，
  确认后可直接拆成 .vue 单文件组件迁进 Vite 工程。

  图表：Ant Design Vue 本身不含图表，这里用 ECharts。
  目标工程建议 vue-echarts（ECharts 的 Vue 3 封装）。

  CDN 提示：如国内网络加载慢，把下面的 unpkg 换成
  https://registry.npmmirror.com/{pkg}/-/{pkg}-{version}.tgz 解包后本地引用，
  或直接 npm 安装到目标工程。
  ================================================================
-->

<link rel="stylesheet" href="https://unpkg.com/ant-design-vue@4.2.6/dist/reset.css">
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>

<!--
  ant-design-vue 4.x 的 UMD 包在加载时会调用 dayjs.extend(...)，
  依赖几个 dayjs 插件已经注册好。CDN 直接引入 dayjs 核心包不带这些插件，
  antd.min.js 加载到一半就会抛错、导致 window.antd 从未被定义，
  整页 Vue 应用挂载失败（表现为白屏 + "antd is not defined"）。
  必须在 antd 脚本之前把插件都 extend 好。
  参考: https://github.com/vueComponent/ant-design-vue/issues/6954
-->
<script src="https://unpkg.com/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/customParseFormat.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/weekday.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/localeData.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/weekOfYear.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/weekYear.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/advancedFormat.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/plugin/quarterOfYear.js"></script>
<script>
  dayjs.extend(dayjs_plugin_customParseFormat);
  dayjs.extend(dayjs_plugin_weekday);
  dayjs.extend(dayjs_plugin_localeData);
  dayjs.extend(dayjs_plugin_weekOfYear);
  dayjs.extend(dayjs_plugin_weekYear);
  dayjs.extend(dayjs_plugin_advancedFormat);
  dayjs.extend(dayjs_plugin_quarterOfYear);
</script>
<script src="https://unpkg.com/ant-design-vue@4.2.6/dist/antd.min.js"></script>
<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Word 导出用。docx 9.x 只发布 dist/index.iife.js（全局名 docx）等，没有 build/ 目录；
     加载失败时页面其余功能不受影响，导出 Word 会提示改用 CSV。 -->
<script src="https://unpkg.com/docx@9.7.1/dist/index.iife.js"></script>

<style>
  :root {
    --brand: #1677ff;
    --warn-bg: #fff2f0;
    --warn-border: #ffccc7;
    --note-bg: #fffbe6;
    --note-border: #ffe58f;
    --ink: #1f1f1f;
    --ink-2: #595959;
    --ink-3: #8c8c8c;
  }
  body {
    margin: 0;
    background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }
  .app-header {
    background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
    color: #fff;
    padding: 20px 28px 18px;
  }
  .app-header h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .app-header .sub { opacity: .85; font-size: 13px; }
  .app-header .meta-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 13px; }
  .app-header .meta-row span { opacity: .92; }
  .app-body { padding: 18px 28px 60px; }   /* 不设宽度上限：随窗口铺满，只留左右 28px 内边距 */

  /*
    主 tab 栏吸附在页面顶部（人工评估 / AI分析 / AI评估）。
    要点：
    - sticky 必须作用在 .ant-tabs-nav 上，它是 .ant-tabs 的子元素；
      sticky 只在其父元素的范围内生效，父元素 .ant-tabs 包着整个 tab 内容，
      所以滚动全程都能吸附。
    - 祖先链上不能有 overflow:hidden/auto，否则 sticky 失效（目前没有，新增样式时注意）。
    - 必须给实底背景，否则滚动时下面的内容会透过导航栏显示出来。
    - 只选 .main-tabs 的直接子级 nav，避免波及页面里其他嵌套的 a-tabs。
  */
  .main-tabs > .ant-tabs-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    margin: 0 0 16px;
    padding: 0 4px;
    background: #f5f7fa;
    box-shadow: 0 1px 0 #e5e8ee;
  }

  /*
    AI分析页的二级导航（指标总览 / ①关键词 … / 逐字稿）吸附在主标签栏正下方。
    - top 必须等于主标签栏的高度，用变量 --main-nav-h 统一管理，不在两处各写一个数字。
      现测高度为 57px（antd large 尺寸的标签栏 + 无外边距）；改了主标签栏的尺寸要同步改这个变量。
    - z-index 必须低于主标签栏（100），否则二级导航滚动到主标签栏下面时会盖住它。
    - 同样需要实底背景，否则下面滚上来的内容会透过导航显示。
    - 只对"AI分析"这一个组件生效（类名由该组件独占），不影响别处的 a-segmented。
  */
  :root { --main-nav-h: 57px; }
  .sub-nav-sticky {
    position: sticky;
    top: var(--main-nav-h);
    z-index: 90;
    margin: 0 -4px 16px;
    padding: 8px 4px;
    background: #f5f7fa;
    box-shadow: 0 1px 0 #e5e8ee;
  }

  /*
    二级导航的 8 个标签：按文字长度分配宽度，并缩小内边距，让它们在默认页面宽度内一行全部显示。
    antd 的 Segmented 默认让每个标签等宽（取最宽那个），1280 宽时每个 151px，而文字只有 42~102px，
    空白被白白浪费，窗口稍窄就有一半标签被省略号截断。
    - flex: 1 1 auto：每个标签先取自己文字的宽度，再平分剩余空间，总宽仍铺满一行；
    - 内边距由 11px 缩到 6px：为短窗口多让出每个标签 10px；
    - 窄于约 840px 时文字本身排不下，此时允许一行内横向滚动而不是被省略号吃掉，
      标签都还点得到（见下方 @media）。
  */
  .sub-nav-sticky .ant-segmented { width: 100%; max-width: 100%; }
  .sub-nav-sticky .ant-segmented-group { display: flex; width: 100%; }
  .sub-nav-sticky .ant-segmented-item { flex: 1 1 auto !important; }
  .sub-nav-sticky .ant-segmented-item-label { padding: 0 6px; min-width: 0; white-space: nowrap; }
  @media (max-width: 840px) {
    .sub-nav-sticky { overflow-x: auto; }
    /* max-width 必须放开，否则上面的 max-width:100% 会把 max-content 压回容器宽度，横向滚动出不来 */
    .sub-nav-sticky .ant-segmented { width: max-content; min-width: 100%; max-width: none; }
    .sub-nav-sticky .ant-segmented-group { width: max-content; min-width: 100%; }
    /* antd 给标签文字设了 overflow:hidden + 省略号；窄屏改成完整显示，由容器横向滚动承接 */
    .sub-nav-sticky .ant-segmented-item { flex: 0 0 auto !important; }
    .sub-nav-sticky .ant-segmented-item-label { overflow: visible; text-overflow: clip; }
  }

  /*
    AI分析的各面板至少撑满"视口高度 - 两层吸附导航"，这样即使某个面板内容很短，
    页面也始终有足够的长度让二级导航吸附到顶部；否则短面板整页不到一屏，页面滚不动，
    导航停在页面中部，看起来像"没法滚动"。
    calc(100vh - 主栏 - 二级栏 - 一点余量)：57 + 49 + 16 = 122px。
  */
  .analysis-panel-fill { min-height: calc(100vh - 122px); }

  .warn-block {
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.75;
    border-left: 4px solid;
  }
  .warn-block.critical { background: var(--warn-bg); border-left-color: #cf1322; }
  .warn-block.note { background: var(--note-bg); border-left-color: #d4b106; }
  .warn-block b { color: #cf1322; }
  .warn-block.note b { color: #ad8b00; }

  .section-title {
    font-size: 16px; font-weight: 600; margin: 0 0 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-desc { color: var(--ink-3); font-size: 12px; margin-bottom: 14px; line-height: 1.7; }

  .chart { width: 100%; height: 300px; }
  .chart.tall { height: 360px; }
  .chart.short { height: 240px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .stat-card {
    background: #fff; border: 1px solid #f0f0f0; border-radius: 8px;
    padding: 14px 16px; position: relative;
  }
  .stat-card .label { color: var(--ink-3); font-size: 12px; margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .stat-card .value.suspect { color: #cf1322; }
  .stat-card .value.na { color: var(--ink-3); font-size: 15px; font-weight: 500; }
  .stat-card .hint { font-size: 11px; color: var(--ink-3); margin-top: 6px; line-height: 1.6; }
  .stat-card .hint.suspect { color: #cf1322; }

  .kv-list { margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .kv-list li { padding: 6px 0; border-bottom: 1px dashed #f0f0f0; line-height: 1.7; }
  .kv-list li:last-child { border-bottom: none; }
  .kv-list .k { color: var(--ink-2); }
  .kv-list .v { font-weight: 600; }

  .ind-card { border: 1px solid #f0f0f0; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .ind-card .ind-text { font-size: 13px; line-height: 1.8; margin-bottom: 8px; }
  .ind-card .ind-note { font-size: 12px; color: var(--ink-3); line-height: 1.75; margin-top: 8px; }
  .ind-card .ev-row { font-size: 12.5px; line-height: 1.9; }
  .ind-card .ev-row .ev-label { color: var(--ink-2); }
  .ind-card .ev-row .ev-value { font-weight: 600; }
  .ind-card .unavail { font-size: 12px; color: #d46b08; line-height: 1.75; }

  .verdict-pass { color: #389e0d; font-weight: 600; }
  .verdict-fail { color: #cf1322; font-weight: 600; }
  .verdict-warn { color: #d46b08; font-weight: 600; }

  .utt-T { color: #0958d9; font-weight: 600; }
  .utt-S { color: #08979c; font-weight: 600; }

  .legend-inline { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; line-height: 1.8; }
  .tag-mini { font-size: 11px; }
  .no-score-banner {
    background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px;
    padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.8;
  }
  .no-score-banner .t { font-weight: 600; color: #237804; }


  /* ---------- 登录页 ---------- */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #e6f0ff 0%, #f5f7fa 55%, #eaf5ff 100%); padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 400px; background: #fff; border-radius: 12px;
    padding: 36px 32px 24px; box-shadow: 0 8px 32px rgba(22, 119, 255, .12);
  }
  .login-brand { text-align: center; margin-bottom: 26px; }
  .login-brand h1 { font-size: 21px; margin: 12px 0 4px; color: #1f1f1f; }
  .login-sub { font-size: 13px; color: #8c8c8c; }
  .login-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; border-radius: 14px; color: #fff; font-weight: 700; font-size: 20px;
    background: linear-gradient(135deg, #1677ff, #0958d9);
  }
  .login-logo.small { width: 30px; height: 30px; border-radius: 8px; font-size: 13px; margin-right: 10px; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 13px; color: #595959; margin-bottom: 6px; }
  .login-note { margin-top: 18px; font-size: 11.5px; line-height: 1.75; color: #a6a6a6; text-align: center; }

  /* ---------- 活动列表 ---------- */
  .list-wrap { min-height: 100vh; background: #f5f7fa; }
  .list-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 56px; background: #fff; box-shadow: 0 1px 0 #e5e8ee;
  }
  .list-title { display: flex; align-items: center; font-size: 16px; font-weight: 600; }
  .list-user { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #595959; }
  .list-body { padding: 24px 28px 60px; }   /* 同上：活动列表也铺满 */
  .list-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
  .list-head h2 { margin: 0 0 4px; font-size: 20px; }
  .act-name { font-weight: 500; }

  /* ---------- 详情页顶部操作条 ---------- */
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header-user { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .95; }

  /* 各页面右上角的导出工具条 */
  .page-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 10px; }

  /* ---------- 课堂逐字稿 ---------- */
  .verbatim-title { font-size: 17px; font-weight: 600; }
  .v-time { font-family: Consolas, Menlo, monospace; color: #595959; font-size: 12.5px; }
  .v-speaker { display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 12px; line-height: 20px; }
  .v-teacher { background: #e6f4ff; color: #0958d9; }
  .v-child { background: #e6fffb; color: #08979c; }
  .v-text { line-height: 1.8; }
  .v-mark { background: #fff1b8; padding: 0 1px; border-radius: 2px; }

  /* 人工评估：1~5 分按钮 */
  .score-row { display: flex; align-items: center; gap: 8px; }
  .score-btn {
    width: 40px; height: 32px; border-radius: 6px; cursor: pointer;
    border: 1px solid #d9d9d9; background: #fff; color: #595959;
    font-size: 14px; font-weight: 600; transition: all .12s;
  }
  .score-btn:hover { border-color: #1677ff; color: #1677ff; }
  .score-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
  .score-row .unscored { font-size: 12px; color: #bfbfbf; margin-left: 4px; }

  /* 人工评估：评估人芯片。姓名限宽省略，整组换行，长名字不会撑坏布局 */
  .rater-chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; }
  .rater-chip {
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 220px; height: 24px; padding: 0 10px;
    border: 1px solid #d9d9d9; border-radius: 6px; background: #fff;
    color: #434343; font-size: 12.5px; cursor: pointer; transition: all .12s;
  }
  .rater-chip:hover { border-color: #1677ff; color: #1677ff; }
  .rater-chip.active { background: #1677ff; border-color: #1677ff; color: #fff; }
  .rater-chip-name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rater-chip-count { flex: none; font-size: 11px; opacity: .75; }

  /* 汇总页里的姓名：同样限宽，避免进度条行被挤变形 */
  .rater-name-cell {
    display: inline-block; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
</style>
</head>
<body>
<div id="app">
  <a-config-provider :theme="{ token: { colorPrimary: '#1677ff', borderRadius: 6 } }">

    <!-- 未登录：登录页 -->
    <login-view v-if="!session" @success="onLogin"></login-view>

    <!-- 已登录：活动分析列表 -->
    <activity-list-view v-else-if="view === 'list'" :session="session" :builtin="builtinActivities"
                        @open="openActivity" @logout="logout"></activity-list-view>

    <!-- 已登录：活动详情。key 绑定活动 id：切换活动时整套组件重建，
         否则 Vue 会复用实例，上一个活动的人工评分会残留在内存里并被写进下一个活动的存储 -->
    <template v-else-if="data">
      <div class="app-header">
        <div class="header-top">
          <a-button size="small" class="header-back" @click="backToList">← 返回活动列表</a-button>
          <div class="header-user">
            <span>{{ session.displayName }}</span>
            <a-button size="small" ghost @click="logout">退出登录</a-button>
          </div>
        </div>
        <h1>AI幼教课堂分析系统</h1>
        <div class="sub">集体教学活动实录 · 人工评估 · AI分析 · AI评估 · 人机综合评估</div>
        <div class="meta-row">
          <span>活动：{{ meta.activity_name }}</span>
          <span>班级：{{ meta.age_group }}</span>
          <span>执教：{{ meta.source_teacher }}</span>
          <span v-if="teachingDateText">授课时间：{{ teachingDateText }}</span>
          <span>时长：{{ durationText }}</span>
          <span>领域：{{ meta.domain }}</span>
        </div>
      </div>

      <div class="app-body">
        <a-tabs :key="data.id" v-model:activeKey="activeModule" size="large" class="main-tabs">
          <a-tab-pane key="verbatim" tab="课堂逐字稿">
            <verbatim-module :data="data"></verbatim-module>
          </a-tab-pane>
          <a-tab-pane key="manual" tab="人工评估">
            <manual-assessment-module :data="data"></manual-assessment-module>
          </a-tab-pane>
          <a-tab-pane key="analysis" tab="AI分析">
            <analysis-module :data="data"></analysis-module>
          </a-tab-pane>
          <a-tab-pane key="assessment" tab="AI评估">
            <assessment-module :data="data"></assessment-module>
          </a-tab-pane>
          <a-tab-pane key="combined" tab="人机综合评估">
            <combined-review-module :data="data" :active="activeModule === 'combined'"></combined-review-module>
          </a-tab-pane>
        </a-tabs>
      </div>
    </template>

  </a-config-provider>
</div>

<script>
// ===================================================================
// 演示数据：由 scripts/build_demo.py 从真实报告数据注入
// （output/荷花镇的早市_分析报告_coding_detail.json + 评估表JSON）

 "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 57, "start": 292.0, "end": null, "speaker": "T", "text": "怎么样的辣椒可以", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 58, "start": 293.0, "end": null, "speaker": "S2", "text": "串起来的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 59, "start": 294.0, "end": null, "speaker": "T", "text": "噢一串一串的辣椒，有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 60, "start": 297.0, "end": null, "speaker": "S2", "text": "有的还在卖肉卖", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 61, "start": 300.0, "end": null, "speaker": "T", "text": "买新鲜的肉，还有的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 62, "start": 304.0, "end": null, "speaker": "S2", "text": "还有的在在卖自己家种的红芋，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 63, "start": 308.0, "end": null, "speaker": "T", "text": "哇它连它的产地都介绍，掌声也送给你。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 64, "start": 313.0, "end": null, "speaker": "T", "text": "那么丰富的菜市场孩子们，如果你在这里，你觉得他们这些人会说些什么话？呢你说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 65, "start": 325.0, "end": null, "speaker": "S3", "text": "有的在嗯他会有的在讨价还价，有的在嗯有的有的在问他几块钱，嗯有的在有的在卖东西，还有的人嗯是是刚刚准备来买，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 66, "start": 347.0, "end": null, "speaker": "T", "text": "嗯有人会讨价还价的，有人会询价的，那个老板还会夸自己的，是吧？有这么多谁来学给我看看？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 67, "start": 356.0, "end": null, "speaker": "T", "text": "噢陶然，你最会表演了，请你来写你你学的是什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 68, "start": 361.0, "end": null, "speaker": "S1", "text": "你", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 69, "start": 362.0, "end": null, "speaker": "T", "text": "想要表演的是里面的人什么声音？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 70, "start": 365.0, "end": null, "speaker": "S4", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 71, "start": 368.0, "end": null, "speaker": "S2", "text": "吆喝的声", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 72, "start": 369.0, "end": null, "speaker": "T", "text": "吆喝，唉你们知道什么叫吆喝吗？吆喝是什么意思？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 73, "start": 374.0, "end": null, "speaker": "S2", "text": "吵架的事。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 74, "start": 375.0, "end": null, "speaker": "T", "text": "他说是吵架是吧？是吵架吗？吆喝不是吵架，谁来解释？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 75, "start": 382.0, "end": null, "speaker": "S2", "text": "就是吆喝就是吸引其他其他顾客的注意力来买他的东西，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 76, "start": 389.0, "end": null, "speaker": "T", "text": "是这样吗？那吆喝的声音有什么特点？你知道吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 77, "start": 393.0, "end": null, "speaker": "S2", "text": "要大", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 78, "start": 394.0, "end": null, "speaker": "T", "text": "声音要大，为什么要大？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 79, "start": 396.0, "end": null, "speaker": "S2", "text": "不然的话很远的声音很远的人是听不到你叫卖的声音，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 80, "start": 402.0, "end": null, "speaker": "T", "text": "唉卖东西要让很远的人听见，所以声音得大，是不是？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 81, "start": 407.0, "end": null, "speaker": "T", "text": "还有什么要吆喝的时候要说清楚什么你知道吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 82, "start": 412.0, "end": null, "speaker": "S2", "text": "我在摆摊的看到时候是拿一个拿一大喇叭，然后挂在那个柱子上，然后一直在喊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 83, "start": 419.0, "end": null, "speaker": "T", "text": "没错的，让声音变得更大，那吆喝的时候陶然你告诉他们，吆喝的时候要讲清楚一些什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 84, "start": 424.0, "end": null, "speaker": "S1", "text": "要？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 85, "start": 425.0, "end": null, "speaker": "S2", "text": "讲清楚你你菜哪里好，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 86, "start": 428.0, "end": null, "speaker": "T", "text": "要把自己菜的特点夸出来，是吧？好，请你来吧，我们看看啊陶然这个老板今天来卖什么了呢？开始吧", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 87, "start": 440.0, "end": null, "speaker": "S2", "text": "卖胡萝卜啦一块钱一斤，胡萝卜又香又脆，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 88, "start": 447.0, "end": null, "speaker": "S1", "text": "它", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 89, "start": 447.0, "end": null, "speaker": "T", "text": "叫的好不好？你们的掌声。呢好，在哪里评价要有理由的，你们觉得他都吆喝的很好，好在什么地方？谁来评价他？你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 90, "start": 459.0, "end": null, "speaker": "S2", "text": "就是我感觉他他说出出了他呃他的他的理由，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 91, "start": 467.0, "end": null, "speaker": "T", "text": "什么东西的理由？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 92, "start": 468.0, "end": null, "speaker": "S2", "text": "就是他他说出了他他的钱几块钱，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 93, "start": 472.0, "end": null, "speaker": "T", "text": "噢他把价格讲清楚了，你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 94, "start": 475.0, "end": null, "speaker": "S2", "text": "他喊得又响，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 95, "start": 476.0, "end": null, "speaker": "T", "text": "声音很响，你都听到了，是不是很远的人都听到了他，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 96, "start": 481.0, "end": null, "speaker": "S2", "text": "他而且他还把自己的菜好处给讲出来了，哇我也要", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 97, "start": 486.0, "end": null, "speaker": "T", "text": "给你们点赞，听的时候小耳朵是竖起来的，才能听的那么清楚，那么完整。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 98, "start": 494.0, "end": null, "speaker": "T", "text": "那么好的胡萝卜谁想来买？呀花生来买，请你来扮演那个顾客。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 99, "start": 504.0, "end": null, "speaker": "S2", "text": "吧请问你请问你这这个胡萝卜几块钱一块", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 100, "start": 510.0, "end": null, "speaker": "T", "text": "钱怎么样？行吗？一块钱。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 101, "start": 512.0, "end": null, "speaker": "S2", "text": "一块钱可以", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 102, "start": 514.0, "end": null, "speaker": "T", "text": "可以成交了是吧？一下子就是卖出去了，你真是一个很棒的老板来付钱付钱。胡萝卜给", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 103, "start": 522.0, "end": null, "speaker": "S2", "text": "他，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 104, "start": 523.0, "end": null, "speaker": "T", "text": "好成交。谁还想来写一写里面的吆喝和讨价还价？我刚才没有听到讨价还价，谁来把这一段也加进去？你你要当什么？你是老板是吗？你卖的是什么？呢你卖的是啥？你也卖胡萝卜，啊行，我们听听看他的胡萝卜和他的有什么不一样，好不好？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 105, "start": 549.0, "end": null, "speaker": "T", "text": "来拿好你的话筒，谁来做他的顾客啊唉这么多，啊我觉得不着急，我们先听听看他的胡萝卜值不值得买，好不好？开始吧。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 106, "start": 562.0, "end": null, "speaker": "S2", "text": "卖胡萝卜了，又香又好吃的胡萝卜，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 107, "start": 568.0, "end": null, "speaker": "T", "text": "我觉得你们我觉得好像声音是不是可以更小一点，你们觉得？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 108, "start": 573.0, "end": null, "speaker": "T", "text": "呢再来试试。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 109, "start": 574.0, "end": null, "speaker": "S2", "text": "看卖胡萝卜了，又香又好吃的胡萝卜，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 110, "start": 580.0, "end": null, "speaker": "T", "text": "去买呀谁想去的？贝泰斯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 111, "start": 582.0, "end": null, "speaker": "S1", "text": "啊有有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 112, "start": 584.0, "end": null, "speaker": "T", "text": "有买卖是讲礼貌的，对吧？你们都不靠", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 113, "start": 588.0, "end": null, "speaker": "S2", "text": "200块钱", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 114, "start": 590.0, "end": null, "speaker": "S1", "text": "几块钱啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 115, "start": 592.0, "end": null, "speaker": "S2", "text": "两块钱两块钱几个？2块钱10个，嗯便宜点行吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 116, "start": 601.0, "end": null, "speaker": "T", "text": "行，那便宜点是几块钱？啊一块钱几个？啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 117, "start": 604.0, "end": null, "speaker": "S2", "text": "2块钱10个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 118, "start": 606.0, "end": null, "speaker": "T", "text": "10个，他让你便宜点", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 119, "start": 607.0, "end": null, "speaker": "S3", "text": "一块钱几个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 120, "start": 609.0, "end": null, "speaker": "T", "text": "嗯一块钱几", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 121, "start": 610.0, "end": null, "speaker": "S2", "text": "个？1块钱", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 122, "start": 611.0, "end": null, "speaker": "S1", "text": "嗯5个，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 123, "start": 613.0, "end": null, "speaker": "S2", "text": "1块钱5", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 124, "start": 615.0, "end": null, "speaker": "T", "text": "个同意吗？你们", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 125, "start": 616.0, "end": null, "speaker": "S1", "text": "同意那", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 126, "start": 619.0, "end": null, "speaker": "S2", "text": "那那到底几块钱？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 127, "start": 621.0, "end": null, "speaker": "T", "text": "那你要买几个？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 128, "start": 623.0, "end": null, "speaker": "T", "text": "呃10来个", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 129, "start": 624.0, "end": null, "speaker": "S2", "text": "我来10个，吧", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 130, "start": 626.0, "end": null, "speaker": "T", "text": "他要买10个，你准备最低价多少钱可以卖给他", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 131, "start": 629.0, "end": null, "speaker": "S2", "text": "喂？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 132, "start": 631.0, "end": null, "speaker": "S3", "text": "5块钱几个？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 133, "start": 632.0, "end": null, "speaker": "S4", "text": "5块，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 134, "start": 633.0, "end": null, "speaker": "T", "text": "你让他一个1个来，他要买10个，你打算几块钱？便宜点嘛", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 135, "start": 639.0, "end": null, "speaker": "S1", "text": "20元1包，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 136, "start": 640.0, "end": null, "speaker": "T", "text": "这么多人买便宜点嘛", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 137, "start": 642.0, "end": null, "speaker": "S2", "text": "买10个3块钱，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 138, "start": 644.0, "end": null, "speaker": "T", "text": "有有可不是更贵的，1块钱卖不卖啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 139, "start": 647.0, "end": null, "speaker": "S1", "text": "10", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 140, "start": 648.0, "end": null, "speaker": "T", "text": "个1块钱行不啦", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 141, "start": 650.0, "end": null, "speaker": "S4", "text": "行？吧", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 142, "start": 650.0, "end": null, "speaker": "T", "text": "行吧，你看我给你们砍价成功了，不行", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 143, "start": 653.0, "end": null, "speaker": "S1", "text": "给你钱给你钱给给给好", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 144, "start": 658.0, "end": null, "speaker": "T", "text": "来请坐。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 145, "start": 663.0, "end": null, "speaker": "T", "text": "我觉得你们学得好像呀你们不仅看懂了菜市场他们在做的事情，而且还能把它演出来，这就像电影一样的，唉刚才好，关于菜市场的这一页我们先分享到这里，你们刚才说荷花镇是一个很热闹的地方，除了这一页的热闹，还有别的地方也是很热闹的吗？你能在书里哪个地方找到", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 146, "start": 693.0, "end": null, "speaker": "S1", "text": "你？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 147, "start": 694.0, "end": null, "speaker": "T", "text": "觉得哪里很热闹，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 148, "start": 695.0, "end": null, "speaker": "S3", "text": "唱戏的那个地方很热闹，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 149, "start": 697.0, "end": null, "speaker": "T", "text": "唱戏，他说你们看到过唱戏那一页吗？看到过谁能最快帮我翻出唱戏的那一页？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 150, "start": 708.0, "end": null, "speaker": "S4", "text": "我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 151, "start": 710.0, "end": null, "speaker": "T", "text": "请你吧你去翻他说唱戏的这一页啊你们都说到我给他先拿出来，找到了吗？需要有人帮你吗？是。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 152, "start": 735.0, "end": null, "speaker": "T", "text": "这一页吧孩子们夜谢谢你成功了，熟悉他很坚定的，他说这一夜唱戏很热闹，为什么你觉得这一夜很热闹的，唱戏就一定很热闹了吗？谁来说说看你的理由？你说傅颖", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 153, "start": 751.0, "end": null, "speaker": "S2", "text": "因因为每次因为那里荷花镇的人都很爱看看戏，所以呢我感觉那里的人都爱看戏，所以好多人都来看，所以那里很热闹。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 154, "start": 764.0, "end": null, "speaker": "S2", "text": "好多的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 155, "start": 765.0, "end": null, "speaker": "T", "text": "人都来了，是在哪里？这一页有好多的人吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 156, "start": 770.0, "end": null, "speaker": "S1", "text": "唉那", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 157, "start": 771.0, "end": null, "speaker": "T", "text": "那个好多的人在哪里？呢你来翻在后面那一页啊是这一页吗？哦原来你们提醒了我这两页讲的都是唱戏的事情，是不是这一页的人会更多，这一页多出来的这些人是什么人？啊比他这一页讲的是唱戏的人，这一页讲的是看戏的人是吧？好，我要来听听看，如果我们就在这个里面可能会听到哪些声音呢会让你觉得很热闹呢？来，请你。男孩你说可能会有什么", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 158, "start": 816.0, "end": null, "speaker": "S3", "text": "声音？好", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 159, "start": 817.0, "end": null, "speaker": "T", "text": "好，什么意思", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 160, "start": 819.0, "end": null, "speaker": "S3", "text": "叫好就是。很好。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 161, "start": 822.0, "end": null, "speaker": "T", "text": "谁说的好？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 162, "start": 825.0, "end": null, "speaker": "S3", "text": "很无语。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 163, "start": 826.0, "end": null, "speaker": "S2", "text": "观众", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 164, "start": 827.0, "end": null, "speaker": "T", "text": "观众会给唱戏的人叫好，是不是称赞他除了叫好观众还会干什么？你来说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 165, "start": 834.0, "end": null, "speaker": "S2", "text": "拍手", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 166, "start": 835.0, "end": null, "speaker": "T", "text": "拍手，为什么要拍手？啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 167, "start": 837.0, "end": null, "speaker": "S2", "text": "因为他们唱的戏，然后观众喜欢看，然后他们就拍手吸引了他，是不是？噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 168, "start": 845.0, "end": null, "speaker": "T", "text": "是这个意思？你说就是那里还有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 169, "start": 848.0, "end": null, "speaker": "S2", "text": "打鼓的，还有打锣的，还有吹号的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 170, "start": 853.0, "end": null, "speaker": "T", "text": "一下子讲了那么多，你都找到。啦来指出来给我们看看，除了你们刚才讲的喏，观众会鼓掌，会", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 171, "start": 863.0, "end": null, "speaker": "S1", "text": "这里有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 172, "start": 863.0, "end": null, "speaker": "T", "text": "叫，好，他还找到了敲，这个是什么？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 173, "start": 867.0, "end": null, "speaker": "S2", "text": "敲鼓的，这里有敲大号的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 174, "start": 871.0, "end": null, "speaker": "T", "text": "敲大号，应该大号是怎么样？这个吹的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 175, "start": 877.0, "end": null, "speaker": "S2", "text": "这里有这里有这里有三种乐器", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 176, "start": 880.0, "end": null, "speaker": "T", "text": "噢有三种乐器中间这个叫什么你知道吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 177, "start": 883.0, "end": null, "speaker": "S2", "text": "叫叫锣，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 178, "start": 885.0, "end": null, "speaker": "S1", "text": "唉那", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 179, "start": 886.0, "end": null, "speaker": "T", "text": "我要问敲锣打鼓声都被你们找到了，在这一夜为什么他们要在这里又敲鼓又又打", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 180, "start": 898.0, "end": null, "speaker": "S4", "text": "入伍？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 181, "start": 899.0, "end": null, "speaker": "T", "text": "打鼓、敲锣用来干什么的？都是用来伴奏的吗？花生你觉得呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 182, "start": 905.0, "end": null, "speaker": "S2", "text": "那边还有卖糖葫芦的人，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 183, "start": 907.0, "end": null, "speaker": "T", "text": "噢你马上就看到了那个卖糖葫芦的是吧？是的，小孩都很会被吸引，敲锣打鼓的声音是用来干什么的？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 184, "start": 916.0, "end": null, "speaker": "S2", "text": "他让你用来吸引顾客来看戏，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 185, "start": 918.0, "end": null, "speaker": "T", "text": "这三种乐器都是这个作用吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 186, "start": 922.0, "end": null, "speaker": "S4", "text": "呃你", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 187, "start": 924.0, "end": null, "speaker": "T", "text": "觉得是的是吧？噢有没有不一样的想法？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 188, "start": 928.0, "end": null, "speaker": "S2", "text": "我觉得这些乐器是让嗯如果没有这些乐器，打打着吹着这样这样这个唱戏，就没有节奏", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 189, "start": 941.0, "end": null, "speaker": "S3", "text": "了，如果", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 190, "start": 941.0, "end": null, "speaker": "S2", "text": "有了就特别的好听，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 191, "start": 944.0, "end": null, "speaker": "T", "text": "嗯他说这些乐器它其中有一个作用就是给唱戏的人伴奏的是吧？而且啊这些声音都是很有节奏的，鼓声是怎么样的？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 192, "start": 957.0, "end": null, "speaker": "S1", "text": "咚咚锵", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 193, "start": 960.0, "end": null, "speaker": "T", "text": "咚咚锵咚咚锵一听又有劲又有节奏。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 194, "start": 967.0, "end": null, "speaker": "S1", "text": "好，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 195, "start": 968.0, "end": null, "speaker": "T", "text": "是的，没错，是给他们打节奏的，我记得还有人跟我说这一个乐器这个罗他还有一个作用，我听你们在阅读的时候，有人跟我提过是谁？还记得吗？这个锣这样铛铛铛敲起来是要干什么的？卢心悦你想起来", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 196, "start": 990.0, "end": null, "speaker": "S2", "text": "就是它它就是吸吸引别人来看戏，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 197, "start": 995.0, "end": null, "speaker": "T", "text": "他说这个锣的作用是吸引别人，他和鼓和那个号子那个唢呐还不一样了，对吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 198, "start": 1003.0, "end": null, "speaker": "T", "text": "好，我们来看看这个人他在敲锣的这个人，他的脸是看向哪里的？看戏台还是看外面？看戏台吗？不是，我把他看，我把他。这样你会看得更清楚，这个人他的表情，他的脸是朝哪里的？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 199, "start": 1024.0, "end": null, "speaker": "S3", "text": "下面", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 200, "start": 1025.0, "end": null, "speaker": "T", "text": "朝下面的对不对？那说明他是要叫更多的人来看戏，如果你是那个敲锣的人，你会怎么喊？叫大家来看戏，你想来试试看是不是？来吧。模仿一下铛铛锣声开始啦招呼他们来看。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 201, "start": 1045.0, "end": null, "speaker": "S2", "text": "戏快来呀快来，呀这里在唱戏呢有很好看的戏，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 202, "start": 1051.0, "end": null, "speaker": "T", "text": "噢一定会有很多很多的人被你的锣声被你的招呼声给吸引来了。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 203, "start": 1059.0, "end": null, "speaker": "T", "text": "在这一夜我们可以听到那么多的声音，孩子们，你觉得荷花镇的人他们喜欢看戏吗？从哪些地方能够感受到除了人很多，他们都会过来看戏，还有哪些细节也能告诉我们，他们很爱看戏，他们喜欢做这件事情，你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 204, "start": 1082.0, "end": null, "speaker": "S2", "text": "有些小朋友都在就是看戏的地方放风筝，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 205, "start": 1089.0, "end": null, "speaker": "T", "text": "男女老少都在这里，小孩会做自己喜欢的事，是吗？还有吗？陶然你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 206, "start": 1094.0, "end": null, "speaker": "S2", "text": "嗯这这这里面还有一个老婆婆带着饭有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 207, "start": 1100.0, "end": null, "speaker": "T", "text": "一个老婆婆带着饭，啊你们都看到过那一页啊对在是吗？那你来你来帮助我找出来，我都没发现在前一页是吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 208, "start": 1113.0, "end": null, "speaker": "S1", "text": "在这一页吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 209, "start": 1115.0, "end": null, "speaker": "T", "text": "哪个？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 210, "start": 1117.0, "end": null, "speaker": "S2", "text": "我知道。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 211, "start": 1118.0, "end": null, "speaker": "S1", "text": "噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 212, "start": 1119.0, "end": null, "speaker": "T", "text": "唉是的，原来这个老婆婆看戏的时候还带着饭，啊为什么她要带着饭？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 213, "start": 1126.0, "end": null, "speaker": "S3", "text": "因为这样别人饿了就可以找这里的老婆婆要饭了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 214, "start": 1133.0, "end": null, "speaker": "T", "text": "你是这么想的，你觉得", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 215, "start": 1136.0, "end": null, "speaker": "S2", "text": "我就是感觉她就是个打着饭就就要看上一天，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 216, "start": 1141.0, "end": null, "speaker": "T", "text": "从早看到晚连吃饭的时间都不想错过是吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 217, "start": 1146.0, "end": null, "speaker": "T", "text": "是呀这个老婆婆原来她也那么爱看戏，关于这一页你们还想分享些什么？呢你来说，你来补充。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 218, "start": 1157.0, "end": null, "speaker": "S3", "text": "他们那里的房子都是很古老的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 219, "start": 1160.0, "end": null, "speaker": "S1", "text": "噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 220, "start": 1162.0, "end": null, "speaker": "T", "text": "你想要介绍荷花镇的另外一个特点了，是吧？好，行，那我们关于噢一个一个来嗯关于荷花镇的戏台子，我们就介绍到这里，刚才金丝雨你来告诉大家，你来翻出来，他说荷花镇还是一个很古老的地方，古老在哪里呢？这一页能说明它足够古老，在哪里？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 221, "start": 1191.0, "end": null, "speaker": "S3", "text": "因为他们的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 222, "start": 1192.0, "end": null, "speaker": "T", "text": "什么东西看上去足够古老，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 223, "start": 1194.0, "end": null, "speaker": "S3", "text": "因为他们的屋顶上面是用瓦片盖成的，我们城市里的房子都是用嗯砖块盖成的，屋顶，它们是三角形的，我们是平平", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 224, "start": 1209.0, "end": null, "speaker": "S1", "text": "的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 225, "start": 1209.0, "end": null, "speaker": "T", "text": "它是从这些房子的屋顶，它的瓦，它的形状来判断，不是我们这个年代的房子，是吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 226, "start": 1218.0, "end": null, "speaker": "T", "text": "噢你可真有一双智慧的眼睛，你比出来了，从房子可以看出来，那是一个古老的地方，还有补充吗？哪里也能看出它的古老？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 227, "start": 1228.0, "end": null, "speaker": "S2", "text": "因为他们的房子都是在水水的旁边做成的，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 228, "start": 1236.0, "end": null, "speaker": "T", "text": "它是用什么搭上来的？建在水边的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 229, "start": 1243.0, "end": null, "speaker": "S4", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 230, "start": 1243.0, "end": null, "speaker": "T", "text": "你想你就是想说它是一个依水而建的小镇是吧？好，我把你的这个也拿出来，它不仅房子看上去很古老，而且它还是一个建在水边的，可以说依水而建的小镇，它的房子还有什么特点？谁再来介绍一下？你来说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 231, "start": 1266.0, "end": null, "speaker": "S2", "text": "它的房子旁边是有一个楼梯可以。嗯下句是通往水的，如果一一个船过来了，如果那个人要乘船的话，就可以就可以从那个楼梯走下去到船上。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 232, "start": 1285.0, "end": null, "speaker": "T", "text": "你说的是这个楼梯是吗？是不是？这里你连这里的人他们的生活习惯都看懂了，他们出行就是从这里来的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 233, "start": 1296.0, "end": null, "speaker": "T", "text": "唉书里是不是有一句话来介绍这里的人他们是怎么样在荷花镇这个水乡生活的？呢谁记得那句话？你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 234, "start": 1309.0, "end": null, "speaker": "S2", "text": "水就是路，船，就是车", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 235, "start": 1312.0, "end": null, "speaker": "T", "text": "是哪一句给它标出来？来，妹妹，你。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 236, "start": 1320.0, "end": null, "speaker": "T", "text": "去，你们这句话看到了吗？好，我要想来考考你们，啊除了这个文字上说了荷花镇", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 237, "start": 1329.0, "end": null, "speaker": "S1", "text": "它", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 238, "start": 1330.0, "end": null, "speaker": "T", "text": "河就是路，船就是车，书本当中的哪一些画面也能够让我们读懂这个地方它的特点，这个特点谁来翻给我？看还是近似于吗？你会从哪里开始介绍呢？它的特点还是这一页，是的，除了这一页还有吗？没错，在这一页我们看到了船，看到了河，还有他们说还有", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 239, "start": 1362.0, "end": null, "speaker": "S1", "text": "这里这", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 240, "start": 1363.0, "end": null, "speaker": "T", "text": "一页也是看到了河是吧？好，赶紧谁还想来翻，不是这页你来，你来翻。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 241, "start": 1373.0, "end": null, "speaker": "T", "text": "刚才你们翻的是这一页对吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 242, "start": 1382.0, "end": null, "speaker": "S1", "text": "还有这一页", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 243, "start": 1383.0, "end": null, "speaker": "T", "text": "噢还有这一页我也给它拿出来，这一页也能看清楚，那是一个水乡的小镇，还有吗还有吗？来你来谢来你来。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 244, "start": 1399.0, "end": null, "speaker": "S4", "text": "看见", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 245, "start": 1400.0, "end": null, "speaker": "T", "text": "哇看到了河那么多的河，每甚至每一页都有大大小小的河流，难怪你们说它是一个建在水边的小镇。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 246, "start": 1413.0, "end": null, "speaker": "T", "text": "唉刚才我们介绍了荷花镇，它是一个依水而建的古老的又热闹的小镇，你觉得它还是一个幸福的小镇，是吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 247, "start": 1428.0, "end": null, "speaker": "T", "text": "哎在这本书上你还能找到幸福，啊好，我把它拿出来，你来告诉我们哪里可以看出来荷花镇的幸福，呢去吧看看他找到的幸福和你们觉得幸福是在同一页上吗？你记得幸福的那件事情", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 248, "start": 1455.0, "end": null, "speaker": "S3", "text": "吗？结婚的那一页，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 249, "start": 1457.0, "end": null, "speaker": "T", "text": "他说是结婚的那一页，谁能很快的迅速的帮他翻到那一页？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 250, "start": 1461.0, "end": null, "speaker": "T", "text": "陶然你来。看看你们觉得幸福的那一页，够幸福吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 251, "start": 1471.0, "end": null, "speaker": "S1", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 252, "start": 1472.0, "end": null, "speaker": "T", "text": "够幸福，结婚就一定是一件幸福的事情，找到了吗？好，我也给它放大，是这一页对吧？对，孩子们结婚在哪里就一起告诉我，不用举手告诉我", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 253, "start": 1483.0, "end": null, "speaker": "S1", "text": "在旁边。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 254, "start": 1487.0, "end": null, "speaker": "T", "text": "在这里是吧？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 255, "start": 1488.0, "end": null, "speaker": "S1", "text": "好，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 256, "start": 1490.0, "end": null, "speaker": "T", "text": "这里的结婚让你觉得很幸福，谁能把他的幸福说的再具体一点？你来说，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 257, "start": 1498.0, "end": null, "speaker": "S2", "text": "因为他们结婚了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 258, "start": 1500.0, "end": null, "speaker": "T", "text": "是呀这件事情就很幸福了，还可以从哪里看出来？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 259, "start": 1503.0, "end": null, "speaker": "T", "text": "你说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 260, "start": 1504.0, "end": null, "speaker": "S2", "text": "我看出来了，这户人家是前不久才结过婚，所以呢他们举着那个结婚的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 261, "start": 1514.0, "end": null, "speaker": "T", "text": "牌子，你们听得懂他说的那个意思吗？他说前不久他们家里就有喜事，或者是说他们为了结婚这件事情，你是从哪里看出来的？他们家有什么特点，什么字？在哪里啊在哪里来找出来这户结婚的人在前面就有看到是吧？你看书的时候是会前后连在一起看的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 262, "start": 1546.0, "end": null, "speaker": "S1", "text": "好，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 263, "start": 1547.0, "end": null, "speaker": "T", "text": "我我也我们一起来帮他找。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 264, "start": 1549.0, "end": null, "speaker": "T", "text": "啊你们有印象吗？那一页是在哪是在这里吗？这里的什么地方贴的喜字？啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 265, "start": 1561.0, "end": null, "speaker": "S2", "text": "这个窗户上", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 266, "start": 1564.0, "end": null, "speaker": "T", "text": "贴了红红的双喜，是呀看到这个我们就觉得心里很幸福的，是吗？好，回到刚才这一页，唉办喜事，结婚确实是一件幸福的事情，那在这一页你还能找到别的幸福吗？还有幸福的地方，你能介绍给我们听吗？你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 267, "start": 1586.0, "end": null, "speaker": "S2", "text": "嗯我刚才看到唉看见", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 268, "start": 1589.0, "end": null, "speaker": "T", "text": "哇你都想跳过去了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-eval"}, {"id": 269, "start": 1590.0, "end": null, "speaker": "S2", "text": "你那里有两个人在乘船，我感觉他们两个也很幸福，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 270, "start": 1594.0, "end": null, "speaker": "T", "text": "噢两个人依偎在一起就是幸福的感受没错的没错的。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 271, "start": 1601.0, "end": null, "speaker": "T", "text": "你说嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 272, "start": 1603.0, "end": null, "speaker": "S2", "text": "那里还有洋洋和他的姑姑到那里还碰见了老还碰见他们家奶奶的朋友张阿婆了，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 273, "start": 1614.0, "end": null, "speaker": "T", "text": "他在这里就找到了张阿婆，哪个是张阿婆？他说这个是张阿婆同意吗？他不同意陶然，你们觉得哪张阿婆是哪个？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 274, "start": 1629.0, "end": null, "speaker": "S1", "text": "啊", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 275, "start": 1630.0, "end": null, "speaker": "T", "text": "好，你来你来一个一个来。我给他放大。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 276, "start": 1637.0, "end": null, "speaker": "T", "text": "噢这个是张阿婆是吧？你是怎么判断出来的？呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 277, "start": 1643.0, "end": null, "speaker": "S1", "text": "他告诉你。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 278, "start": 1646.0, "end": null, "speaker": "T", "text": "嗯因为他的头转过去跟他在讲话是吧？谁记得当时他们讲了什么话，他们的对话让你觉得很温暖的是吧？很幸福的，那么说说看他他们讲了些什么，呢请坐。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 279, "start": 1660.0, "end": null, "speaker": "S3", "text": "他说的是", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 280, "start": 1661.0, "end": null, "speaker": "S4", "text": "嗯嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 281, "start": 1663.0, "end": null, "speaker": "S3", "text": "今天是嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 282, "start": 1666.0, "end": null, "speaker": "T", "text": "谁说的这句话？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 283, "start": 1668.0, "end": null, "speaker": "S3", "text": "嗯这是他姑姑说的，他说今天是老奶奶的嗯7过70大寿，你要早点来，然后呢张阿婆说，嗯嗯我还我还给老奶奶给老奶奶酿了自己老奶奶爱喝的嗯自己做的米酒。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 284, "start": 1694.0, "end": null, "speaker": "T", "text": "噢张阿婆给老太太准备了她自己做的米酒，那你们猜猜看。当老太太收到了张阿婆的礼物，收到了她的祝福的时候，老太太的心里感受是怎么样的？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 285, "start": 1711.0, "end": null, "speaker": "S1", "text": "很", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 286, "start": 1711.0, "end": null, "speaker": "S2", "text": "幸福、很开心、很幸福、", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 287, "start": 1713.0, "end": null, "speaker": "T", "text": "开心的、幸福的，还有呢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 288, "start": 1715.0, "end": null, "speaker": "S2", "text": "很快乐", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 289, "start": 1716.0, "end": null, "speaker": "T", "text": "很快乐的。还有呢？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 290, "start": 1719.0, "end": null, "speaker": "S2", "text": "很温暖", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 291, "start": 1719.0, "end": null, "speaker": "T", "text": "很温暖的是呀如果我们过生日的时候，有朋友那么惦记着我，一定是一件幸福的事情，唉这本书上的温暖与幸福，老老师也想来和你们分享一页，你们猜我分享的这一页是什么？呢你们有看到过吗？猜猜看，为什么？我觉得这一幅上面他就足够幸福？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 292, "start": 1750.0, "end": null, "speaker": "T", "text": "说说看你的理由，你来说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": null}, {"id": 293, "start": 1753.0, "end": null, "speaker": "S2", "text": "因为这里有很很好看的奶油蛋糕，老太太看见一定感觉她很幸福，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 294, "start": 1763.0, "end": null, "speaker": "T", "text": "没错的，我也是这么想的，有蛋糕，老太太过生日的那个人就是觉得心里甜甜的，还有吗？你说", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 295, "start": 1771.0, "end": null, "speaker": "S1", "text": "老", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 296, "start": 1772.0, "end": null, "speaker": "S2", "text": "老太太太。老太太觉得的这一桌美食看起来都很好吃，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 297, "start": 1781.0, "end": null, "speaker": "T", "text": "嗯食物那么丰盛，就是幸福生活的象征，还有吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 298, "start": 1787.0, "end": null, "speaker": "S2", "text": "这些好吃的很多很多开，他应该会很吃惊，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 299, "start": 1792.0, "end": null, "speaker": "T", "text": "没错的，有好吃的就是一种幸福的感受。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 300, "start": 1796.0, "end": null, "speaker": "T", "text": "你觉得这个圆桌可能换来哪些人？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-T"}, {"id": 301, "start": 1800.0, "end": null, "speaker": "S4", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 302, "start": 1802.0, "end": null, "speaker": "S2", "text": "有有很多人这这些圆桌上面的东西老太太会喜欢。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 303, "start": 1813.0, "end": null, "speaker": "T", "text": "嗯没错的，因为给老太太过寿，所以大家都为她准备了她喜欢的东西，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 304, "start": 1819.0, "end": null, "speaker": "S2", "text": "因为桌上都有老太太爱吃的东西，有鱼、有蛋糕、有肉，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "I-C"}, {"id": 305, "start": 1827.0, "end": null, "speaker": "S3", "text": "什么都有。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 306, "start": 1829.0, "end": null, "speaker": "T", "text": "嗯是，呀没错，你们讲的都很对，我们中国人在什么时候会坐上这张圆桌？你们有坐过这样的圆桌吗？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 307, "start": 1839.0, "end": null, "speaker": "S1", "text": "有什么", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 308, "start": 1840.0, "end": null, "speaker": "T", "text": "时候会坐上这张圆桌？你说。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 309, "start": 1843.0, "end": null, "speaker": "S1", "text": "嗯", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 310, "start": 1844.0, "end": null, "speaker": "S2", "text": "每次我去吃饭的时候我们是随便乱跳的，然后就看到一个圆桌就坐下来，", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 311, "start": 1851.0, "end": null, "speaker": "T", "text": "这个圆桌是周边可以坐的人多不多？", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 312, "start": 1854.0, "end": null, "speaker": "S2", "text": "唉多的", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 313, "start": 1855.0, "end": null, "speaker": "T", "text": "很多的很多的人聚在一起，那就叫一个字，谁一个词谁会说，很多的人团在一起坐在一起，我们可以说那看中国人就喜欢团团圆圆，团团圆圆就是中国人的幸福是吧？没错的，所以在这一页上", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}, {"id": 314, "start": 1875.0, "end": null, "speaker": "S1", "text": "噢", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "R"}, {"id": 315, "start": 1876.0, "end": null, "speaker": "T", "text": "我们把他的幸福是的，你肯定也是一个幸福的家庭。好，孩子们分享到这里，我们都说荷花镇他有那4个特点，如果有人再来问你，你就可以告诉他，但是呢我相信这本书如果我们再一次去看去读，你还会发现荷花镇里面那些有趣的事情和有趣的人。下一次我们再来讲一讲。", "is_group_response": false, "needs_review": true, "diarization": true, "irf_role": "F-ext"}], "chains": [{"start_id": 1, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 1}, {"role": "R", "utt_id": 2}, {"role": "F-ext", "utt_id": 3}, {"role": "R", "utt_id": 4}, {"role": "F-ext", "utt_id": 5}], "end_id": 5, "ir_pairs": 2, "has_feedback": true}, {"start_id": 6, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 6}, {"role": "R", "utt_id": 7}, {"role": "F-ext", "utt_id": 8}, {"role": "R", "utt_id": 9}, {"role": "R", "utt_id": 10}, {"role dback": false}, {"start_id": 294, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 294}, {"role": "R", "utt_id": 295}, {"role": "R", "utt_id": 296}, {"role": "F-ext", "utt_id": 297}, {"role": "R", "utt_id": 298}, {"role": "F-ext", "utt_id": 299}], "end_id": 299, "ir_pairs": 3, "has_feedback": true}, {"start_id": 300, "initiator": "T", "turns": [{"role": "I-T", "utt_id": 300}, {"role": "R", "utt_id": 301}, {"role": "R", "utt_id": 302}, {"role": "F-ext", "utt_id": 303}], "end_id": 303, "ir_pairs": 2, "has_feedback": true}, {"start_id": 304, "initiator": "C", "turns": [{"role": "I-C", "utt_id": 304}, {"role": "R", "utt_id": 305}, {"role": "F-ext", "utt_id": 306}, {"role": "R", "utt_id": 307}, {"role": "F-ext", "utt_id": 308}, {"role": "R", "utt_id": 309}, {"role": "R", "utt_id": 310}, {"role": "F-ext", "utt_id": 311}, {"role": "R", "utt_id": 312}, {"role": "F-ext", "utt_id": 313}, {"role": "R", "utt_id": 314}, {"role": "F-ext", "utt_id": 315}], "end_id": 315, "ir_pairs": 6, "has_feedback": true}], "dataFlags": {"no_punctuation": false, "no_diarization": false, "teacher_turn_count": 155}, "verbatim": {"title": "大班阅读活动《荷花镇的早市》课堂原文", "sourceFile": "大班阅读活动《荷花镇的早市》课堂原文.doc", "rows": [{"no": 1, "time": "00:00:12", "speaker": "老师", "text": "孩子们，今天我们要来分享最近你们在读的这本书，它的名字是？"}, {"no": 2, "time": "00:00:23", "speaker": "学生1", "text": "荷花镇的早市"}, {"no": 3, "time": "00:00:23", "speaker": "老师", "text": "唉那读完了这本书，你觉得荷花镇它是一个怎样的地方？谁能来分享？女孩，你来"}, {"no": 4, "time": "00:00:35", "speaker": "学生2", "text": "是一个很热闹的地方，因为菜市场有很多卖的东西，他们都很好吃，路边的船上还有很多刚刚酿好的酒。"}, {"no": 5, "time": "00:00:50", "speaker": "老师", "text": "哇！菜场的热闹给你留下了深刻的印象，是吧？唉！给我们翻出来，我们来看看热闹的菜市场会在哪一页？来吧，你来翻。"}, {"no": 6, "time": "00:01:03", "speaker": "老师", "text": "觉得荷花镇它是一个热闹的地方，那是因为它有一个热闹的菜场。孩子们，你们有看到这一页吗？看看他能找到吗？哪一页菜场？陶然，你来帮他一下，你帮来帮他翻一下，好，我们来找到是这一页吗？"}, {"no": 7, "time": "00:01:36", "speaker": "学生1", "text": "唉"}, {"no": 8, "time": "00:01:38", "speaker": "老师", "text": "这一页的菜场就很热闹，是吧？你说。谁能来具体跟我说一说这一夜的热闹在哪里？你来说。"}, {"no": 9, "time": "00:01:49", "speaker": "学生2", "text": "有的在"}, {"no": 10, "time": "00:01:50", "speaker": "学生3", "text": "卖东西，"}, {"no": 11, "time": "00:01:52", "speaker": "学生4", "text": "嗯嗯"}, {"no": 12, "time": "00:01:53", "speaker": "学生3", "text": "有的在刚刚来，嗯有的在买，还有的在"}, {"no": 13, "time": "00:02:02", "speaker": "老师", "text": "卖，听到了吗？掌声送给你。唉他用上了有的有的有的还有的把这一页上卖的人、买的人、过路的人都介绍的很清楚，谁也来试一试。"}, {"no": 14, "time": "00:02:20", "speaker": "学生2", "text": "我觉得荷花真是"}, {"no": 15, "time": "00:02:22", "speaker": "老师", "text": "你想介绍这一页的什么？"}, {"no": 16, "time": "00:02:23", "speaker": "学生2", "text": "这一页有的人过来买东西是还有的人过来卖蔬菜，还有的人过来来来是因为想过来玩，"}, {"no": 17, "time": "00:02:36", "speaker": "老师", "text": "噢你连他的想法都猜到了，那在这一夜他们在卖一些什么？呀那么多的蔬菜，有哪些蔬菜？呢谁来介绍？"}, {"no": 18, "time": "00:02:45", "speaker": "学生2", "text": "有番茄，有大白菜，"}, {"no": 19, "time": "00:02:48", "speaker": "老师", "text": "你来拿着我们来点给大家看，把你介绍的东西指给他们看。"}, {"no": 20, "time": "00:02:53", "speaker": "学生3", "text": "有番茄"}, {"no": 21, "time": "00:02:56", "speaker": "老师", "text": "有番茄，他说怎么样的番茄？啊"}, {"no": 22, "time": "00:03:00", "speaker": "学生3", "text": "红彤的番茄"}, {"no": 23, "time": "00:03:01", "speaker": "老师", "text": "是是是噢有红彤彤的番茄，"}, {"no": 24, "time": "00:03:07", "speaker": "学生2", "text": "有"}, {"no": 25, "time": "00:03:07", "speaker": "学生3", "text": "胡萝卜、橙橙的胡萝卜、"}, {"no": 26, "time": "00:03:10", "speaker": "老师", "text": "橙橙的胡萝卜，"}, {"no": 27, "time": "00:03:12", "speaker": "学生3", "text": "还有绿绿的大白菜，"}, {"no": 28, "time": "00:03:15", "speaker": "老师", "text": "还有绿绿的大白菜，你发现在哪？啊在这里是吧？"}, {"no": 29, "time": "00:03:19", "speaker": "学生1", "text": "嗯"}, {"no": 30, "time": "00:03:19", "speaker": "老师", "text": "噢他用上了，有的有的还有的把三种蔬菜都介绍的很完整，谢谢你，还有吗？谁也来展示？你？来。罗欣悦拿着。你想介绍的是这一页的什么？"}, {"no": 31, "time": "00:03:32", "speaker": "学生2", "text": "嗯就是就是很有很多，这里有很多还有很多蔬菜，"}, {"no": 32, "time": "00:03:38", "speaker": "老师", "text": "嗯你也想要介绍蔬菜，介绍的能不能跟它不一样，介绍的更多？"}, {"no": 33, "time": "00:03:44", "speaker": "老师", "text": "好，你来。"}, {"no": 34, "time": "00:03:45", "speaker": "学生2", "text": "就是就是有的在卖豆腐，"}, {"no": 35, "time": "00:03:49", "speaker": "学生4", "text": "嗯"}, {"no": 36, "time": "00:03:49", "speaker": "学生2", "text": "还有的人在卖肉，"}, {"no": 37, "time": "00:03:53", "speaker": "老师", "text": "马上又还有的吗？"}, {"no": 38, "time": "00:03:54", "speaker": "学生2", "text": "还还有的还有的在在在卖在卖，一些不还有一些人在卖红玉，"}, {"no": 39, "time": "00:04:05", "speaker": "老师", "text": "嗯"}, {"no": 40, "time": "00:04:06", "speaker": "学生2", "text": "还还有一些人在卖辣椒，"}, {"no": 41, "time": "00:04:10", "speaker": "老师", "text": "噢辣椒在哪？啊"}, {"no": 42, "time": "00:04:12", "speaker": "学生2", "text": "在这里。"}, {"no": 43, "time": "00:04:13", "speaker": "老师", "text": "噢你觉得这个是红红的一串一串的是它的辣椒是吧？是这个是吗？噢它用上了唉谁能告你？你能告诉我还有的用在什么"}, {"no": 44, "time": "00:04:24", "speaker": "学生1", "text": "时候，嗯还"}, {"no": 45, "time": "00:04:25", "speaker": "老师", "text": "还有的用在哪里？"}, {"no": 46, "time": "00:04:27", "speaker": "学生1", "text": "最后面"}, {"no": 47, "time": "00:04:28", "speaker": "老师", "text": "用在最后面，那你愿意愿不愿意把这个再来一遍，说说看。"}, {"no": 48, "time": "00:04:33", "speaker": "老师", "text": "我来，帮你指你来说好不好他想要介绍的蔬菜，"}, {"no": 49, "time": "00:04:38", "speaker": "学生3", "text": "有有的的白"}, {"no": 50, "time": "00:04:40", "speaker": "老师", "text": "嗯怎么样的豆腐？啊"}, {"no": 51, "time": "00:04:42", "speaker": "学生3", "text": "白豆腐"}, {"no": 52, "time": "00:04:43", "speaker": "老师", "text": "有白白的豆腐，"}, {"no": 53, "time": "00:04:46", "speaker": "学生4", "text": "有"}, {"no": 54, "time": "00:04:46", "speaker": "学生2", "text": "还有"}, {"no": 55, "time": "00:04:48", "speaker": "学生3", "text": "的"}, {"no": 56, "time": "00:04:49", "speaker": "学生2", "text": "有的在卖辣椒，"}, {"no": 57, "time": "00:04:52", "speaker": "老师", "text": "怎么样的辣椒可以"}, {"no": 58, "time": "00:04:53", "speaker": "学生2", "text": "串起来的"}, {"no": 59, "time": "00:04:54", "speaker": "老师", "text": "噢一串一串的辣椒，有"}, {"no": 60, "time": "00:04:57", "speaker": "学生2", "text": "有的还在卖肉卖"}, {"no": 61, "time": "00:05:00", "speaker": "老师", "text": "买新鲜的肉，还有的"}, {"no": 62, "time": "00:05:04", "speaker": "学生2", "text": "还有的在
